<style>
  :root{
    --ink:#1b1610; --charcoal:#2a2118; --paper:#f3efe7; --card:#ffffff;
    --line:#e7e0d3; --line-2:#d8cfbd;
    --gold:#a9782f; --gold-2:#c79a49; --gold-soft:#f4ead4;
    --muted:#8c8172; --muted-2:#b6ab99;
    --pos:#2f7d54; --pos-soft:#e6f1ea; --neg:#b23b3b; --neg-soft:#f7e7e5;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(27,22,16,.04), 0 8px 24px rgba(27,22,16,.06);
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Lato', 'Inter', system-ui, -apple-system, sans-serif;
    --side-bg:#1b1610; --input-bg:#fdfcf9; --hover:#faf7f1; --glow:#efe7d6;
    /* dashboard jewel palette (Pakistani festive dyes) */
    --d-bg:#0b0910; --d-bg2:#141020; --d-ink:#f4eefc; --d-muted:#a99fc4; --d-line:rgba(255,255,255,.09);
    --d-card:rgba(255,255,255,.045); --d-td:#e9e3f5; --d-rowline:rgba(255,255,255,.05); --d-pos:#3ee0a0; --d-warn:#ff8fab;
    --d-chip-bg:linear-gradient(135deg,rgba(255,92,155,.22),rgba(177,42,143,.22)); --d-chip-bd:rgba(255,92,155,.4); --d-chip-ink:#ffd6e6;
    --d-g1:rgba(125,123,255,.18); --d-g2:rgba(255,92,155,.16); --d-shadow:0 30px 70px -30px rgba(10,6,20,.8); --d-grid:rgba(255,255,255,.07);
    --j-emerald1:#12b886; --j-emerald2:#0b7a63;
    --j-gold1:#f9b233; --j-gold2:#e0592b;
    --j-magenta1:#ff5c9b; --j-magenta2:#b12a8f;
    --j-indigo1:#7d7bff; --j-indigo2:#5127c4;
  }
  /* ---- themes (per-device, chosen in Settings) ----
     Light + colourful themes also give the dashboard a light panel; dark themes keep the jewel-dark panel. */
  html[data-theme="mild"], html[data-theme="deep"], html[data-theme="rose"], html[data-theme="peacock"],
  html[data-theme="lavender"], html[data-theme="sunset"]{
    --d-ink:var(--ink); --d-muted:var(--muted); --d-line:rgba(0,0,0,.09); --d-card:rgba(255,255,255,.62);
    --d-td:var(--ink); --d-rowline:rgba(0,0,0,.07); --d-pos:#1f8a5a; --d-warn:#c2284f;
    --d-chip-bg:#fde3ec; --d-chip-bd:#f1a9c0; --d-chip-ink:#a1214f; --d-grid:rgba(0,0,0,.08);
    --d-shadow:0 24px 50px -28px rgba(60,40,10,.35); }
  html[data-theme="mild"]{ --d-bg:#fbf6ea; --d-bg2:#f0e5cf; --d-g1:rgba(169,120,47,.18); --d-g2:rgba(224,89,43,.10); }
  html[data-theme="deep"]{ --ink:#2a1d0e; --charcoal:#3a2a16; --paper:#d6c19a; --card:#efe1c2; --line:#c4ad80; --line-2:#b19869;

    --gold:#b8326a; --gold-2:#d9558a; --gold-soft:#fbd9e5; --muted:#8f6075; --muted-2:#bf97a8; --pos-soft:#e3f3ea; --neg-soft:#fbe0e4;

    --d-bg:#eaf8f5; --d-bg2:#bfe6df; --d-g1:rgba(20,160,148,.24); --d-g2:rgba(56,189,248,.16);
    --j-emerald1:#16bfae; --j-emerald2:#0b7d73; --j-gold1:#f7c95a; --j-gold2:#df8a2c;
    --j-magenta1:#3da9ec; --j-magenta2:#1b5fa8; --j-indigo1:#35b887; --j-indigo2:#136a46; }
  html[data-theme="lavender"]{ --ink:#241b3d; --charcoal:#33295a; --paper:#ece7fb; --card:#fcfbff; --line:#d9d1f3; --line-2:#bdb0e8;
    --gold:#6a47c9; --gold-2:#8d6df0; --gold-soft:#e3dcfb; --muted:#6f6598; --muted-2:#a49bcb; --pos-soft:#e1f2ea; --neg-soft:#fbe3ea;
    --side-bg:#2a1f52; --input-bg:#f7f4ff; --hover:#f0ecfd; --glow:#dcd3f7;
    --shadow:0 1px 2px rgba(60,40,140,.06), 0 8px 24px rgba(60,40,140,.12);
    --d-bg:#f3efff; --d-bg2:#d9cffa; --d-g1:rgba(141,109,240,.26); --d-g2:rgba(255,122,182,.16);
    --j-emerald1:#8f7dff; --j-emerald2:#5a3dd0; --j-gold1:#ffb85a; --j-gold2:#ee7c32;
    --j-magenta1:#ff7ab8; --j-magenta2:#c0398f; --j-indigo1:#4fb5ff; --j-indigo2:#2f6fd8; }
  html[data-theme="sunset"]{ --ink:#3a1a0c; --charcoal:#4d2511; --paper:#ffeadb; --card:#fffaf5; --line:#f6d3bb; --line-2:#ecb995;
    --gold:#d2491f; --gold-2:#f06a3a; --gold-soft:#ffddc6; --muted:#946348; --muted-2:#c79a80; --pos-soft:#e3f2e8; --neg-soft:#fbe0dc;
    --side-bg:#4a1d0e; --input-bg:#fff6ee; --hover:#ffefe2; --glow:#fbd6bd;
    --shadow:0 1px 2px rgba(150,60,20,.07), 0 8px 24px rgba(150,60,20,.13);
    --d-bg:#fff1e4; --d-bg2:#fcc9a4; --d-g1:rgba(240,106,58,.26); --d-g2:rgba(255,200,61,.22);
    --j-emerald1:#ff8f45; --j-emerald2:#e0522a; --j-gold1:#ffd042; --j-gold2:#f09a1c;
    --j-magenta1:#ff5f80; --j-magenta2:#c22a5c; --j-indigo1:#a064e8; --j-indigo2:#5f30b3; }
  html[data-theme="dark"]{ --ink:#efe7d8; --charcoal:#dad1c1; --paper:#1b1712; --card:#26201a;
    --line:#362e24; --line-2:#463b2d; --muted:#a89a85; --muted-2:#857a69;
    --gold-soft:#3b2f1b; --pos-soft:#15271d; --neg-soft:#2f1b19; --side-bg:#120f0b;
    --input-bg:#201a13; --hover:#2c251b; --glow:#241d13;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.45); }
  html[data-theme="night"]{ --ink:#f2ebdf; --charcoal:#ded5c6; --paper:#0a0908; --card:#15120e;
    --line:#241f18; --line-2:#332b20; --muted:#9a8e7b; --muted-2:#776d5d;
    --gold-soft:#2f260f; --pos-soft:#10211a; --neg-soft:#281614; --side-bg:#060504;
    --input-bg:#120f09; --hover:#1d1811; --glow:#15100a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.6); }
  html[data-theme="midnight"]{ --ink:#e6eefc; --charcoal:#cfdcf3; --paper:#0b1220; --card:#121b2f; --line:#1e2c49; --line-2:#2b3c5f;
    --gold:#5f9bff; --gold-2:#8fbcff; --gold-soft:#172a4d; --muted:#8ea3c4; --muted-2:#647a9e; --pos:#4cc38a; --neg:#ef6b6b;
    --pos-soft:#0f2a22; --neg-soft:#2a1620; --side-bg:#070c17; --input-bg:#0e1626; --hover:#18243d; --glow:#101a2e;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.5);
    --d-bg:#0a1020; --d-bg2:#14264a; --d-g1:rgba(95,155,255,.24); --d-g2:rgba(56,220,200,.14);
    --j-emerald1:#22d3a5; --j-emerald2:#0e8a74; --j-gold1:#ffc24a; --j-gold2:#ee7a2b;
    --j-magenta1:#ff6b9a; --j-magenta2:#b0307f; --j-indigo1:#5f9bff; --j-indigo2:#2b4fd0; }
  html[data-theme="plum"]{ --ink:#f6e9f3; --charcoal:#e6cfe0; --paper:#1a0d19; --card:#261425; --line:#3b2139; --line-2:#4e2e4a;
    --gold:#e879b9; --gold-2:#f29ccb; --gold-soft:#3d1c39; --muted:#b995b3; --muted-2:#8f6d89; --pos:#4cc38a; --neg:#ff7a85;
    --pos-soft:#12261c; --neg-soft:#321519; --side-bg:#12070f; --input-bg:#1f0f1e; --hover:#321b30; --glow:#231222;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.5);
    --d-bg:#16081a; --d-bg2:#35123a; --d-g1:rgba(232,121,185,.24); --d-g2:rgba(168,85,247,.2);
    --j-emerald1:#d96bc0; --j-emerald2:#8e2f86; --j-gold1:#ffb25e; --j-gold2:#e8553a;
    --j-magenta1:#ff6f9d; --j-magenta2:#b6285f; --j-indigo1:#a077ff; --j-indigo2:#5a2fc2; }
  html[data-theme="charcoal"]{ --ink:#f3efe6; --charcoal:#ddd6c6; --paper:#131313; --card:#1d1d1d; --line:#2c2c2c; --line-2:#3b3b3b;
    --gold:#d4a537; --gold-2:#e8bf5c; --gold-soft:#2d2512; --muted:#a39a88; --muted-2:#7a7366; --pos:#4cc38a; --neg:#ef6b6b;
    --pos-soft:#13251b; --neg-soft:#2b1717; --side-bg:#0a0a0a; --input-bg:#171717; --hover:#272727; --glow:#1a1710;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.55);
    --d-bg:#0e0e0e; --d-bg2:#24200f; --d-g1:rgba(212,165,55,.22); --d-g2:rgba(255,255,255,.05);
    --j-emerald1:#2fbf8f; --j-emerald2:#157a5c; --j-gold1:#ecc260; --j-gold2:#bd7a1a;
    --j-magenta1:#d9647f; --j-magenta2:#8f2f4d; --j-indigo1:#7f90f2; --j-indigo2:#3f4db3; }
  /* little swatch dot on the theme buttons */
  .sw{display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:-2px;
    border:1px solid rgba(0,0,0,.25)}
  /* ---- fonts (per-device) ---- */
  html[data-font="roboto"]{ --sans:'Roboto', system-ui, sans-serif; }
  html[data-font="poppins"]{ --sans:'Poppins', system-ui, sans-serif; }
  html[data-font="spartan"]{ --sans:'League Spartan', system-ui, sans-serif; }
  html[data-font="serif"]{ --sans:'Cormorant Garamond', Georgia, serif; }
  /* theme-switch segmented control */
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg-btn{padding:9px 16px; border:1px solid var(--line-2); border-radius:9px; background:var(--input-bg);
    color:var(--charcoal); font-weight:700; font-size:13px}
  .seg-btn.on{background:var(--gold); color:#fff; border-color:var(--gold)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); font-weight:700; color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
  }
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit; font-weight:700; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:15px; font-weight:700}
  a{color:var(--gold)}

  /* ---------- wordmark ---------- */
  .brand{display:flex; flex-direction:column; gap:6px; line-height:1}
  .brand .name{font-family:var(--serif); font-weight:700; letter-spacing:.14em; font-size:26px}
  .brand .sub{align-self:flex-start; background:var(--muted); color:#fff; font-size:9px;
    letter-spacing:.34em; padding:3px 9px 2px; font-weight:600}
  .brand .tag{color:var(--muted); font-size:10.5px; letter-spacing:.02em; margin-top:2px}

  /* ---------- setup screen ---------- */
  #setup{min-height:100%; display:grid; place-items:center; padding:24px;
    background:radial-gradient(120% 90% at 50% -10%, var(--glow) 0%, var(--paper) 55%)}
  .setup-card{width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 28px}
  .setup-card .brand{align-items:center; text-align:center; margin-bottom:6px}
  .setup-card h1{font-family:var(--serif); font-weight:600; font-size:22px; text-align:center; margin:14px 0 2px}
  .setup-card p.lead{text-align:center; color:var(--muted); margin:0 0 20px; font-size:13.5px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--charcoal);
    letter-spacing:.02em; margin-bottom:6px}
  .field input, .field textarea, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line-2); border-radius:var(--radius-sm);
    background:var(--input-bg); color:var(--ink); transition:border-color .15s, box-shadow .15s}
  .se-q, .se-p, .se-b{padding:9px 8px; border:1px solid var(--line-2); border-radius:var(--radius-sm);
    background:var(--input-bg); color:var(--ink)}
  .se-q:focus, .se-p:focus, .se-b:focus{outline:none; border-color:var(--gold)}
  .se-tbl th, .se-tbl td{padding:8px 4px}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,120,47,.14)}
  .field .hint{font-size:11.5px; color:var(--muted-2); margin-top:5px}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-weight:600; font-size:14px; transition:transform .05s, background .15s, border-color .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--side-bg); color:#f6f1e7}
  .btn-primary:hover{background:#000}
  .btn-gold{background:var(--gold); color:#fff}
  .btn-gold:hover{background:#986a26}
  .btn-ghost{background:transparent; color:var(--charcoal); border-color:var(--line-2)}
  .btn-ghost:hover{border-color:var(--muted); background:var(--hover)}
  .btn-danger{background:var(--neg-soft); color:var(--neg); border-color:#ecccc8}
  .btn-danger:hover{background:#f2d9d6}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px; font-size:13px}
  .btn-icon{padding:7px 9px; font-size:13px; background:var(--hover); border:1px solid var(--line-2); border-radius:8px; color:var(--charcoal)}
  .btn-icon:hover{border-color:var(--muted)}

  /* ---------- splash + login ---------- */
  #splash{min-height:100%; display:grid; place-items:center}
  #login{min-height:100%; display:none; place-items:center; padding:24px;
    background:radial-gradient(120% 90% at 50% -10%, var(--glow) 0%, var(--paper) 55%)}
  #login.on{display:grid}
  #lg-err{color:var(--neg); font-size:13px; font-weight:600; min-height:18px; margin:-2px 0 12px; text-align:center}

  /* ---------- app shell ---------- */
  #app{display:none; min-height:100%}
  .shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
  .side{background:var(--side-bg); color:#e9e1d2; padding:26px 18px; display:flex; flex-direction:column; gap:26px}
  .side .brand .name{color:#f6f1e7}
  .side .brand .tag{color:#b8ab93}
  .nav{display:flex; flex-direction:column; gap:4px}
  .nav button{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:transparent; border:none; color:#cdc3af; padding:11px 13px; border-radius:10px;
    font-size:14.5px; font-weight:500; letter-spacing:.01em}
  .nav button .ic{width:20px; text-align:center; font-size:16px; opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.05); color:#f2ead9}
  .nav button.on{background:linear-gradient(90deg, rgba(169,120,47,.22), rgba(169,120,47,.06));
    color:#fff; box-shadow:inset 3px 0 0 var(--gold-2)}
  .side .foot{margin-top:auto; font-size:11.5px; color:#8f836c; display:flex; flex-direction:column; gap:10px}
  .side .foot button{background:none; border:none; color:#b8ab93; text-align:left; padding:0; font-size:12px}
  .side .foot button:hover{color:#e9e1d2; text-decoration:underline}

  .main{padding:30px 34px 60px; overflow-x:hidden}
  .view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
  .view-head h2{font-family:var(--sans); font-weight:900; font-size:26px; margin:0; letter-spacing:.01em; text-transform:uppercase}
  .view-head .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:3px}

  /* ---------- cards / grid ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px}
  .stat{padding:18px 18px 16px; position:relative; overflow:hidden}
  .stat::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .stat .k{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .stat .v{font-family:var(--serif); font-weight:600; font-size:30px; margin-top:6px; line-height:1}
  .stat .m{font-size:12px; color:var(--muted); margin-top:6px}
  .stat.green .v{color:var(--pos)} .stat.green::before{background:linear-gradient(90deg,var(--pos),#57a97c)}


  /* ---------- dashboard search ---------- */
  .gs{position:relative; margin:-4px 0 18px; z-index:1}
  .gs input{width:100%; padding:14px 16px 14px 46px; border-radius:14px; border:1px solid var(--d-line);
    background:var(--d-card); color:var(--d-ink); font-size:15px; font-weight:700}
  .gs input::placeholder{color:var(--d-muted); font-weight:400}
  .gs input:focus{outline:none; border-color:var(--gold-2); box-shadow:0 0 0 3px rgba(199,154,73,.2)}
  .gs-mag{position:absolute; left:17px; top:50%; transform:translateY(-50%); font-size:19px; color:var(--d-muted); pointer-events:none}
  #gs-res{position:relative; z-index:1; margin-bottom:6px}
  .gs-h{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--d-muted); font-weight:900; margin:12px 2px 6px}
  .gs-row{display:flex; justify-content:space-between; gap:12px; align-items:center; padding:11px 14px; border:1px solid var(--d-line);
    background:var(--d-card); border-radius:12px; margin-bottom:6px; color:var(--d-td)}

  .ogi{--o-ink:#241726; --o-plum:#3A2340; --o-garnet:#98284B; --o-garnet-soft:#F6EAEF; --o-gold:#B99331; --o-gold-soft:#F8F2E2;

  .ogi *{box-sizing:border-box; margin:0; padding:0; font-family:'Lato',system-ui,sans-serif}
  .ogi .og-head{background:var(--o-plum); color:#fff; padding:19px 30px 17px; display:flex; align-items:center; gap:18px; position:relative}
  .ogi .og-head::after{content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
    background:repeating-linear-gradient(90deg,var(--o-gold) 0 13px,transparent 13px 19px,var(--o-garnet) 19px 32px,transparent 32px 38px)}
  .ogi .og-logo{width:74px; height:74px; border-radius:50%; flex:none; background:#000; object-fit:cover}
  .ogi .og-brand h1{font-weight:900; font-size:25px; letter-spacing:.11em; line-height:1.05; color:#fff; text-transform:none}
  .ogi .og-moto{font-size:10.5px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--o-gold); margin-top:6px}
  .ogi .og-tag{font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#CBB8CE; margin-top:7px; line-height:1.5}
  .ogi .og-mark{margin-left:auto; text-align:right}
  .ogi .og-word{font-weight:300; font-size:21px; letter-spacing:.30em; color:#fff}
  .ogi .og-no{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#CBB8CE; margin-top:7px}
  .ogi .og-no b{display:inline-block; min-width:108px; text-align:right; color:#fff; font-size:11px; letter-spacing:.05em; font-weight:700;
    border-bottom:1px dotted #8E7B92; padding:1px 0}
  .ogi .og-strip{background:var(--o-gold-soft); border-bottom:1px solid var(--o-line); padding:7px 30px; text-align:center; font-size:10px;
    font-weight:700; letter-spacing:.20em; text-transform:uppercase; color:var(--o-plum)}
  .ogi .og-strip b{color:var(--o-garnet); font-weight:900}
  .ogi .og-meta{display:grid; grid-template-columns:1.2fr 1fr; border-bottom:1px solid var(--o-line)}
  .ogi .og-meta > div{padding:14px 30px}
  .ogi .og-meta > div:first-child{border-right:1px solid var(--o-line)}
  .ogi .og-eyebrow{font-size:9.5px; font-weight:900; letter-spacing:.20em; text-transform:uppercase; color:var(--o-garnet); margin-bottom:9px}
  .ogi .og-field{display:flex; align-items:baseline; gap:9px; margin-bottom:6px}
  .ogi .og-field label{font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--o-muted); min-width:58px; flex:none; margin:0; display:block}
  .ogi input, .ogi textarea{flex:1; width:100%; border:none; border-bottom:1px solid var(--o-line); border-radius:0; background:transparent;
    font-family:'Lato',sans-serif; font-size:12.5px; font-weight:700; color:var(--o-ink); padding:3px 2px 4px; height:26px; line-height:18px; box-shadow:none}
  .ogi input:focus, .ogi textarea:focus{outline:none; border-bottom-color:var(--o-garnet); background:#FDF7F9; box-shadow:none}
  .ogi input::placeholder, .ogi textarea::placeholder{color:#b9aeb2; font-weight:400}
  .ogi .og-chips{display:flex; flex-wrap:wrap; gap:6px}
  .ogi .og-chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--o-line); border-radius:999px; padding:5px 11px;
    font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; background:#fff; user-select:none; color:var(--o-ink)}
  .ogi .og-chip::before{content:""; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--o-garnet); flex:none}
  .ogi .og-chip.on{background:var(--o-garnet); border-color:var(--o-garnet); color:#fff}
  .ogi .og-chip.on::before{background:#fff; border-color:#fff}
  .ogi .og-grp + .og-grp{margin-top:10px}
  .ogi table{width:100%; border-collapse:collapse; margin:0}
  .ogi thead th{background:var(--o-garnet); color:#fff; font-size:9.5px; font-weight:900; letter-spacing:.16em; text-transform:uppercase;
    padding:9px 8px; text-align:left; border:none; white-space:nowrap}
  .ogi thead th:first-child{padding-left:30px; width:36px}
  .ogi thead th.r{text-align:right}
  .ogi thead th:last-child{padding-right:30px}
  .ogi tbody td{padding:9px 8px; border-bottom:1px solid var(--o-line); vertical-align:middle; font-size:12.5px; color:var(--o-ink); font-weight:700; height:31px}
  .ogi tbody td:first-child{padding-left:30px}
  .ogi tbody td:last-child{padding-right:30px}
  .ogi tbody tr:hover{background:transparent}
  .ogi td.r{text-align:right; white-space:nowrap}
  .ogi .og-rowno{font-size:11px; font-weight:900; color:var(--o-gold)}
  .ogi .og-totals{display:grid; grid-template-columns:1fr 296px; padding:13px 30px 4px; gap:20px}
  .ogi .og-note textarea{height:64px; min-height:64px; border:1px solid var(--o-line); border-radius:4px; background:#fff; font-size:11.5px; font-weight:400; padding:7px 9px; resize:none; line-height:1.55}
  .ogi .og-sums{align-self:start}
  .ogi .og-sumrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--o-line)}
  .ogi .og-sumrow span{color:var(--o-muted); font-weight:900; letter-spacing:.10em; text-transform:uppercase; font-size:9.5px}
  .ogi .og-sumrow strong{font-weight:900; font-size:12.5px}
  .ogi .og-grand{display:flex; justify-content:space-between; align-items:center; background:var(--o-plum); color:#fff; padding:10px 13px; margin-top:8px; border-radius:3px}
  .ogi .og-grand span{font-size:9.5px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--o-gold)}
  .ogi .og-grand strong{font-size:21px; font-weight:900}
  .ogi .og-due{display:flex; justify-content:space-between; align-items:center; border:1.5px solid var(--o-garnet); color:var(--o-garnet); padding:7px 13px; margin-top:6px; border-radius:3px}
  .ogi .og-due span{font-size:9.5px; font-weight:900; letter-spacing:.16em; text-transform:uppercase}
  .ogi .og-due strong{font-size:14.5px; font-weight:900}
  .ogi .og-pay{padding:11px 30px 0; display:grid; grid-template-columns:1fr 1fr; gap:20px}
  .ogi .og-foot{margin-top:14px; border-top:1px solid var(--o-line); padding:14px 30px 18px}
  .ogi .og-sign{display:flex; justify-content:space-between; align-items:flex-end; gap:24px}
  .ogi .og-thanks{font-weight:900; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--o-garnet)}
  .ogi .og-thanks small{display:block; font-weight:400; font-size:10.5px; letter-spacing:.02em; text-transform:none; color:var(--o-muted); margin-top:5px}
  .ogi .og-signbox{text-align:center; min-width:190px}
  .ogi .og-signbox input{text-align:center; border-bottom:1px solid var(--o-ink); padding:4px 2px 5px}
  .ogi .og-signbox p{font-size:9.5px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--o-muted); margin-top:6px}
  .ogi .og-contact{margin-top:14px; background:var(--o-gold-soft); border-radius:3px; padding:9px 14px; display:flex; flex-wrap:wrap; gap:5px 20px;
    justify-content:center; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--o-plum)}
  .ogi .og-contact b{font-weight:900; color:var(--o-garnet)}
  .ogi .og-terms{margin-top:10px; font-size:9px; font-weight:400; line-height:1.7; color:var(--o-muted); text-align:center; letter-spacing:.02em}
  .ogi .og-terms b{font-weight:900; color:var(--o-ink)}

  /* ===================== DASHBOARD (dark jewel showpiece) ===================== */
  .dash{
    background:
      radial-gradient(120% 80% at 12% -10%, var(--d-g1) 0%, transparent 42%),
      radial-gradient(110% 80% at 100% 0%, var(--d-g2) 0%, transparent 45%),
      linear-gradient(160deg, var(--d-bg2) 0%, var(--d-bg) 60%);
    color:var(--d-ink); border-radius:24px; padding:30px 30px 26px;
    box-shadow:var(--d-shadow); position:relative; overflow:hidden;
  }
  .dash::after{content:""; position:absolute; inset:0; border-radius:24px; border:1px solid var(--d-line); pointer-events:none}
  .dash-top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; position:relative; z-index:1}
  .dash-eyebrow{font-family:var(--sans); font-weight:900; letter-spacing:.28em; font-size:11px;
    color:var(--gold-2); text-transform:uppercase; margin-bottom:8px}
  .dash-title{font-family:var(--sans); font-weight:900; font-size:34px; line-height:1.02; letter-spacing:-.01em; margin:0}
  .dash-date{color:var(--d-muted); font-size:13px; margin-top:7px; font-weight:400}
  .dash-new{background:linear-gradient(135deg,var(--j-gold1),var(--j-gold2)); color:#2a1500; border:none;
    font-weight:900; font-size:14px; letter-spacing:.01em; padding:12px 20px; border-radius:12px;
    box-shadow:0 10px 24px -8px rgba(224,89,43,.6)}
  .dash-new:active{transform:translateY(1px)}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px; position:relative; z-index:1}
  .tile{border-radius:18px; padding:20px 18px; color:#fff; position:relative; overflow:hidden;
    box-shadow:0 16px 34px -18px rgba(0,0,0,.7); opacity:0; transform:translateY(14px)}
  .tile.in{animation:tileIn .55s cubic-bezier(.2,.7,.2,1) forwards}
  .tile .tk{font-size:12.5px; font-weight:700; letter-spacing:.01em; opacity:.92}
  .tile .tv{font-weight:900; font-size:33px; line-height:1.05; margin-top:10px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .tile .tm{font-size:11.5px; margin-top:8px; opacity:.8; font-weight:400}
  .tile .glyph{position:absolute; right:-6px; top:-10px; font-size:78px; opacity:.16; line-height:1}
  .tile.emerald{background:linear-gradient(150deg,var(--j-emerald1),var(--j-emerald2))}
  .tile.gold{background:linear-gradient(150deg,var(--j-gold1),var(--j-gold2))}
  .tile.magenta{background:linear-gradient(150deg,var(--j-magenta1),var(--j-magenta2))}
  .tile.indigo{background:linear-gradient(150deg,var(--j-indigo1),var(--j-indigo2))}
  @keyframes tileIn{to{opacity:1; transform:none}}

  .dash .d-row{display:grid; grid-template-columns:1.6fr 1fr; gap:16px; align-items:start; position:relative; z-index:1}
  .d-card{background:var(--d-card); border:1px solid var(--d-line); border-radius:16px; padding:18px 20px}
  .d-card h3{font-family:var(--sans); font-weight:900; font-size:14px; letter-spacing:.03em; margin:0 0 14px; text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between; color:var(--d-ink)}
  .d-card h3 .yr{font-weight:700; font-size:12px; color:var(--d-muted)}
  .dash .low-chip{display:inline-block; margin:0 6px 6px 0; padding:5px 11px; border-radius:999px; font-size:12px;
    font-weight:700; background:var(--d-chip-bg);
    border:1px solid var(--d-chip-bd); color:var(--d-chip-ink)}
  .dash .low-ok{color:var(--d-muted); font-size:13px}
  .dash table{width:100%; border-collapse:collapse}
  .dash th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--d-muted);
    font-weight:700; text-align:left; padding:9px 12px; border-bottom:1px solid var(--d-line)}
  .dash td{padding:11px 12px; border-bottom:1px solid var(--d-rowline); font-size:13.5px; color:var(--d-td)}
  .dash td.num{text-align:right} .dash th.num{text-align:right}
  .dash .pos{color:var(--d-pos); font-weight:700}
  .dash .empty{color:var(--d-muted); text-align:center; padding:22px}
  @media (prefers-reduced-motion:reduce){ .tile{opacity:1; transform:none; animation:none} }

  .row2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:16px; align-items:start}
  .row2 > *{min-width:0}
  @media (max-width:480px){ .stat-grid .stat .v{font-size:clamp(18px,6vw,24px)} .stat-grid .stat{padding-left:12px;padding-right:12px} }
  .pre4{grid-template-columns:repeat(4,1fr)} @media (max-width:760px){ .pre4{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .rt th, .rt td{padding:10px 8px}
  @media (max-width:760px){ .rt th, .rt td{padding:9px 5px; font-size:12.5px} .rt th{font-size:10px; letter-spacing:.03em} }
  .panel{padding:18px 20px}
  .panel h3{font-family:var(--sans); font-weight:900; font-size:16px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; text-transform:uppercase; letter-spacing:.02em}
  .panel h3 .count{font-family:var(--sans); font-size:11px; color:var(--muted); font-weight:600}

  /* ---------- table ---------- */
  table{width:100%; border-collapse:collapse}
  th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line)}
  td{padding:11px 12px; border-bottom:1px solid #f0ebe0; font-size:14px; vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--hover)}
  td.num, th.num{text-align:right}
  td.num, th.num{white-space:nowrap}
  .lowstock td{background:var(--neg-soft)}
  .lowstock:hover td{background:#f4ddda}

  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:.02em}
  .pill.pos{background:var(--pos-soft); color:var(--pos)}
  .pill.warn{background:var(--neg-soft); color:var(--neg)}
  .pill.brand{background:var(--gold-soft); color:var(--gold-2)}
  .pill.pre{background:rgba(124,92,224,.17); color:#6b47d6}
  .pill.pre{white-space:nowrap}
  .pill.amber{background:rgba(240,170,40,.2); color:#b97800}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chk{display:flex; align-items:center; gap:9px; cursor:pointer; font-size:14px}
  .chk input{width:19px; height:19px; accent-color:var(--gold)}
  .money.pos{color:var(--pos); font-weight:600}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center}
  .search{flex:1; min-width:200px; position:relative}
  .search input{width:100%; padding:10px 12px 10px 36px; border:1px solid var(--line-2); border-radius:var(--radius-sm); background:var(--card)}
  .search input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,120,47,.14)}
  .search .mag{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted-2)}

  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-family:var(--serif); font-size:20px; color:var(--charcoal); margin-bottom:6px}

  /* ---------- POS ---------- */
  .posview{display:grid; grid-template-columns:1fr 380px; gap:16px; align-items:start}
  .pos-products{padding:16px 18px; max-height:72vh; overflow:auto}
  .plist{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .pitem{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--input-bg)}
  .pitem:hover{border-color:var(--gold-2); background:var(--hover)}
  .pitem .pn{font-weight:600}
  .pitem .pd{font-size:12px; color:var(--muted)}
  .pitem .pr{margin-left:auto; text-align:right}
  .pitem .add{color:var(--gold); font-weight:700; font-size:20px; line-height:1}
  .stock-tag{font-size:11px; color:var(--muted)}
  .stock-tag.low{color:var(--neg); font-weight:600}

  .cart{padding:16px 18px; position:sticky; top:20px}
  .cart h3{font-family:var(--serif); font-weight:600; font-size:19px; margin:0 0 12px}
  .cart-lines{display:flex; flex-direction:column; gap:8px; margin-bottom:12px; max-height:34vh; overflow:auto}
  .cl{display:grid; grid-template-columns:1fr auto; gap:4px 8px; padding:9px 0; border-bottom:1px solid #f0ebe0}
  .cl .nm{font-weight:600; font-size:13.5px}
  .cl .lt{text-align:right; font-weight:600}
  .qty{display:inline-flex; align-items:center; gap:0; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
  .qty button{width:26px; height:26px; border:none; background:#f5f0e7; color:var(--charcoal); font-size:15px}
  .qty button:hover{background:var(--gold-soft)}
  .qty span{min-width:30px; text-align:center; font-weight:600; font-size:13px}
  .cl .rm{background:none; border:none; color:var(--muted-2); font-size:15px; padding:0 4px}
  .cl .rm:hover{color:var(--neg)}
  .totline{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; color:var(--charcoal)}
  .totline.grand{border-top:1px solid var(--line-2); margin-top:6px; padding-top:10px; font-size:16px; font-weight:700}
  .totline.grand .v{font-family:var(--serif); font-size:22px}
  .cart .mini{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  .cart .mini input, .cart select, .cart .fullsel{width:100%; padding:9px 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--input-bg)}
  .cart label.mini-l{font-size:11px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px}

  /* ---------- modal ---------- */
  .backdrop{position:fixed; inset:0; background:rgba(27,22,16,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .backdrop.on{display:flex}
  .modal{background:var(--card); border-radius:var(--radius); box-shadow:0 24px 60px rgba(0,0,0,.28); width:100%; max-width:520px; max-height:88vh; overflow:auto}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line)}
  .modal-head h3{font-family:var(--serif); font-weight:600; font-size:21px; margin:0}
  .modal-head .x{background:none; border:none; font-size:22px; color:var(--muted); line-height:1}
  .modal-body{padding:20px 22px}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}

  /* ---------- toast ---------- */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--side-bg); color:#f6f1e7; padding:12px 20px; border-radius:10px; font-size:14px;
    opacity:0; transition:all .25s; z-index:80; box-shadow:0 12px 30px rgba(0,0,0,.3); max-width:90vw}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--neg)}
  #toast.ok{background:var(--pos)}

  .loading{padding:60px; text-align:center; color:var(--muted)}
  .spin{width:26px; height:26px; border:3px solid var(--line-2); border-top-color:var(--gold); border-radius:50%; margin:0 auto 12px; animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- invoice (print) ---------- */
  .inv{padding:6px 4px; color:#1b1610}
  .inv .ih{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:14px}
  .inv .ih .shop{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:.1em}
  .inv .ih .meta{text-align:right; font-size:12px; color:var(--charcoal)}
  .inv .who{display:flex; justify-content:space-between; font-size:13px; margin-bottom:14px}
  .inv table{margin-bottom:12px}
  .inv .tot{margin-left:auto; width:60%; max-width:260px}
  .inv .note{font-size:12px; color:var(--muted); margin-top:14px; border-top:1px dashed var(--line-2); padding-top:10px}

  /* ---------- mobile ---------- */
  .mtopbar{display:none}
  .mbottom{display:none}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}

<script>
/* shop info (invoice header/footer) now lives in Firestore: see getCfg/setCfg in the sync layer below */
const state = { products:[], customers:[], cart:[], customerId:'', view:'dashboard', chart:null };

/* ---- appearance: theme + font, saved per device ---- */
function lsGet(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); try{ localStorage.setItem('omme_theme',t); }catch(e){} }
function applyFont(f){ document.documentElement.setAttribute('data-font',f); try{ localStorage.setItem('omme_font',f); }catch(e){} }
(function(){ document.documentElement.setAttribute('data-theme', lsGet('omme_theme','mild'));
  document.documentElement.setAttribute('data-font', lsGet('omme_font','lato')); })();

/* ===================== ui helpers ===================== */
const $ = s => document.querySelector(s);
const tk = n => '\u09f3' + (Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(iso){ const d=new Date(iso); if(isNaN(d)) return esc(iso||''); return d.getDate()+' '+MONTHS[d.getMonth()]+', '+d.getFullYear(); }

let toastT;
function toast(msg, type){
  const t=$('#toast'); t.textContent=msg; t.className='show '+(type||'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2600);
}

/* ===================== OMME'S GALLERY — Local data core (Vol 6) =====================
   Ported from the Google Apps Script backend. Runs entirely in the browser against an
   in-memory DB kept in sync with Firestore (see sync layer below). Exposes the same api(action, payload) the UI uses. */

const TABLES = ['Products','Customers','Sales','SaleItems','Suppliers','Expenses',
  'Purchases','PurchaseItems','Returns','ReturnItems','Dues','Lots'];
const KEY = {
  Products:'ID', Customers:'ID', Sales:'InvoiceNo', SaleItems:'InvoiceNo',
  Suppliers:'ID', Expenses:'ID', Purchases:'PurchaseNo', PurchaseItems:'PurchaseNo',
  Returns:'ReturnNo', ReturnItems:'ReturnNo', Dues:'ID', Lots:'ID'
};
const LOW_STOCK = 1;
const NUM_FIELDS = ['BuyPrice','SalePrice','Stock','Amount'];

let DB = null;

function emptyDB(){ const o = { _seq:{} }; TABLES.forEach(function(t){ o[t]=[]; }); return o; }
function ensureDB(){ if(!DB) DB=emptyDB(); if(!DB._seq) DB._seq={}; TABLES.forEach(function(t){ if(!Array.isArray(DB[t])) DB[t]=[]; }); }

function num(v){ return Number(v) || 0; }
function pad3(n){ return ('000'+n).slice(-3); }
function p2(n){ return ('0'+n).slice(-2); }
function ymd(d){ d=d||new Date(); return String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate()); }
function dstr(v){ const d=new Date(v); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function ym(v){ const d=new Date(v); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function yy(v){ return String(new Date(v).getFullYear()); }
/* numbers normally come from the shared counter (claimed in api() before the action runs) */
function nextNo(table, prefix){
  let n = CLAIM[table];
  if(n == null){ n = (DB._seq[table]||0) + 1; PENDING_INC.push(table); }   // offline: take locally, bump the counter on sync
  DB._seq[table] = Math.max(DB._seq[table]||0, n); delete CLAIM[table];
  return prefix + ymd() + '-' + pad3(n);
}
function newId(prefix){ return prefix + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*46656).toString(36); }

function readAll(name){ return DB[name].map(function(r){ return Object.assign({}, r); }); }
function coerce(item){ NUM_FIELDS.forEach(function(f){ if(item[f]!==undefined && item[f]!=='') item[f]=Number(item[f])||0; }); return item; }
function rowIndex(name, id){ const k=KEY[name]; return DB[name].findIndex(function(r){ return String(r[k])===String(id); }); }
function findProduct(id){ return DB.Products.find(function(p){ return String(p.ID)===String(id); }); }

/* ---------- CRUD ---------- */
function saveRow(name, item, prefix){
  coerce(item);
  const k = KEY[name];
  let id = item[k];
  const arr = DB[name];
  let isNew=false;
  if(!id){ id = newId(prefix); item[k]=id; item.CreatedAt = new Date().toISOString(); }
  const i = arr.findIndex(function(r){ return String(r[k])===String(id); });
  if(i>-1){ const ex=arr[i]; const merged=Object.assign({}, ex, item); if(ex.CreatedAt) merged.CreatedAt=ex.CreatedAt; arr[i]=merged; }
  else { if(!item.CreatedAt) item.CreatedAt=new Date().toISOString(); arr.push(Object.assign({}, item)); isNew=true; }
  return { id:id, isNew:isNew };
}
function deleteRow(name, id){ const i=rowIndex(name,id); if(i>-1) DB[name].splice(i,1); return { deleted:i>-1 }; }

/* ---------- FIFO lot costing ----------
   Every time stock enters (new product, Purchase, Return) a Lot row is recorded
   with its own BuyPrice and remaining Qty. Every sale consumes the OLDEST lots
   first, so profit reflects what that specific unit actually cost — even if the
   product's displayed BuyPrice has since gone up from a later restock. */
function consumeLotsFIFO(productId, qty, fallbackBuyPrice){
  let remaining=num(qty), costSum=0;
  const lots=DB.Lots.filter(function(l){ return String(l.ProductID)===String(productId) && num(l.Qty)>0; })
    .sort(function(a,b){ return new Date(a.Date)-new Date(b.Date); });
  for(let i=0;i<lots.length && remaining>0;i++){
    const l=lots[i]; const take=Math.min(num(l.Qty), remaining);
    if(take<=0) continue;
    costSum += take*num(l.BuyPrice); l.Qty=num(l.Qty)-take; remaining-=take;
  }
  if(remaining>0){ costSum += remaining*num(fallbackBuyPrice); remaining=0; }
  return num(qty)>0 ? costSum/num(qty) : 0;
}
function addLot(productId, buyPrice, qty, purchaseNo){
  if(!productId || num(qty)<=0) return;
  DB.Lots.push({ ID:newId('LOT'), ProductID:productId, BuyPrice:num(buyPrice), Qty:num(qty),
    Date:new Date().toISOString(), PurchaseNo:purchaseNo||'' });
}

/* ---------- Sales ---------- */
/* Delivery is only printed on the invoice (the courier gets that money, not us), so what we count as
   the sale amount is always Subtotal - Discount. Old rows that stored Delivery inside Total are covered too. */
function saleNet(s){ return num(s.Subtotal)-num(s.Discount); }
function L_createSale(sale, items){
  items = items || [];
  const invNo = nextNo('Sales','OG');
  const now = new Date();
  let subtotal=0, profit=0;
  items.forEach(function(it){
    const qty=num(it.Qty), sp=num(it.SalePrice);
    const p=findProduct(it.ProductID);
    const fallback=p?num(p.BuyPrice):num(it.BuyPrice);
    const bp = it.ProductID ? consumeLotsFIFO(it.ProductID, qty, fallback) : num(it.BuyPrice);
    it.BuyPrice = Math.round(bp*100)/100;
    it.LineTotal=qty*sp; it.LineProfit=qty*(sp-it.BuyPrice);
    subtotal+=it.LineTotal; profit+=it.LineProfit;
    if(p) p.Stock = num(p.Stock) - qty;
  });
  const discount=num(sale.Discount), delivery=num(sale.Delivery);
  const total=subtotal-discount;           // delivery is NOT part of our accounts
  const netProfit=profit-discount;
  DB.Sales.push({ InvoiceNo:invNo, Date:now.toISOString(), CustomerID:sale.CustomerID||'', CustomerName:sale.CustomerName||'',
    Subtotal:subtotal, Discount:discount, Delivery:delivery, Total:total, Profit:netProfit,
    Payment:sale.Payment||'Cash', Status:sale.Status||'Delivered', Note:sale.Note||'',
    Preorder:!!sale.Preorder, PreorderDate:sale.PreorderDate||'',
    DeliverAfter:sale.DeliverAfter||'', DeliverBy:deliverBy(now.toISOString(), sale.DeliverAfter||'') });
  items.forEach(function(it){
    DB.SaleItems.push({ InvoiceNo:invNo, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
      Qty:num(it.Qty), SalePrice:num(it.SalePrice), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal, LineProfit:it.LineProfit });
  });
  const received = (sale.Paid===''||sale.Paid==null) ? total : num(sale.Paid);
  let due=0;
  if(received<total){
    due=total-received;
    DB.Dues.push({ ID:newId('D'), Date:now.toISOString(), InvoiceNo:invNo, CustomerID:sale.CustomerID||'',
      CustomerName:sale.CustomerName||'', Amount:due, Paid:0, Balance:due, Status:'Due', Note:'' });
  }
  return { invoiceNo:invNo, subtotal:subtotal, discount:discount, delivery:delivery, total:total, payable:total+delivery, profit:netProfit, received:received, due:due };
}
function L_listSales(){ return readAll('Sales').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_getSale(no){
  const sale = DB.Sales.filter(function(s){ return String(s.InvoiceNo)===String(no); }).map(function(r){return Object.assign({},r);})[0]||null;
  const dues = DB.Dues.filter(function(d){ return String(d.InvoiceNo)===String(no); });
  let dueAmt=0, paidLater=0, due=0; dues.forEach(function(d){ dueAmt+=num(d.Amount); paidLater+=num(d.Paid); due+=num(d.Balance); });
  const net = sale ? saleNet(sale) : 0;
  const received = sale ? Math.min(Math.max(num(sale.Total)-dueAmt+paidLater, 0), net) : 0;   // money received so far (our part)
  return { sale: sale,
           items: DB.SaleItems.filter(function(i){ return String(i.InvoiceNo)===String(no); }).map(function(r){return Object.assign({},r);}),
           received: received, due: due };
}
/* Edit an existing sale: customer, date, payment, discount, delivery (invoice only), money received,
   and each line's qty / price. Stock and FIFO lots are corrected for qty changes; the due row is rebuilt. */
function L_updateSale(no, patch, edits){
  patch = patch || {}; edits = edits || {};
  const sale = DB.Sales.find(function(x){ return String(x.InvoiceNo)===String(no); });
  if(!sale) return {error:'Sale not found'};
  const cur = L_getSale(no);
  const rows = DB.SaleItems.filter(function(i){ return String(i.InvoiceNo)===String(no); });
  rows.forEach(function(it){
    const ed = edits[it._k]; if(!ed) return;
    const oldQty=num(it.Qty), newQty=Math.max(0,num(ed.Qty)), d=newQty-oldQty, origBP=num(it.BuyPrice);
    const p=findProduct(it.ProductID);
    if(d>0){
      const fb=p?num(p.BuyPrice):num(it.BuyPrice);
      const c = it.ProductID ? consumeLotsFIFO(it.ProductID, d, fb) : num(it.BuyPrice);
      it.BuyPrice = Math.round(((oldQty*num(it.BuyPrice)+d*c)/newQty)*100)/100;
      if(p) p.Stock = num(p.Stock) - d;
    } else if(d<0){
      if(p) p.Stock = num(p.Stock) - d;                    // d is negative: units come back to stock
      if(it.ProductID) addLot(it.ProductID, it.BuyPrice, -d, '');
    }
    if(ed.BuyPrice!==undefined && ed.BuyPrice!==null && ed.BuyPrice!=='' && num(ed.BuyPrice)!==origBP) it.BuyPrice=num(ed.BuyPrice);  // real cost entered after the dress arrived
    it.Qty=newQty; it.SalePrice=num(ed.SalePrice);
    it.LineTotal=newQty*it.SalePrice; it.LineProfit=newQty*(it.SalePrice-num(it.BuyPrice));
  });
  for(let i=DB.SaleItems.length-1;i>=0;i--){
    const it=DB.SaleItems[i]; if(String(it.InvoiceNo)===String(no) && num(it.Qty)<=0) DB.SaleItems.splice(i,1);
  }
  let subtotal=0, profit=0;
  DB.SaleItems.forEach(function(it){ if(String(it.InvoiceNo)===String(no)){ subtotal+=num(it.LineTotal); profit+=num(it.LineProfit); } });
  const discount=num(patch.Discount), delivery=num(patch.Delivery), net=subtotal-discount;
  sale.Subtotal=subtotal; sale.Discount=discount; sale.Delivery=delivery; sale.Total=net; sale.Profit=profit-discount;
  if(patch.Payment) sale.Payment=patch.Payment;
  if(patch.Preorder!==undefined) sale.Preorder=!!patch.Preorder;
  if(patch.PreorderDate!==undefined) sale.PreorderDate=patch.PreorderDate||'';
  if(patch.Status) sale.Status=patch.Status;
  if(patch.Note!==undefined) sale.Note=patch.Note||'';
  if(patch.DeliverAfter!==undefined){ sale.DeliverAfter=patch.DeliverAfter||''; }
  if(patch.CustomerID!==undefined){ sale.CustomerID=patch.CustomerID||''; sale.CustomerName=patch.CustomerName||''; }
  if(patch.Date && dstr(sale.Date)!==patch.Date){
    const q=patch.Date.split('-'); sale.Date=new Date(+q[0],+q[1]-1,+q[2],12,0,0).toISOString();
  }
  if(patch.DeliverAfter!==undefined || patch.Date){ sale.DeliverBy=deliverBy(sale.Date, sale.DeliverAfter||''); }
  const received = (patch.Received===''||patch.Received==null) ? cur.received : Math.max(0,num(patch.Received));
  for(let i=DB.Dues.length-1;i>=0;i--){ if(String(DB.Dues[i].InvoiceNo)===String(no)) DB.Dues.splice(i,1); }
  const bal = net - received;
  if(bal>0){
    DB.Dues.push({ ID:newId('D'), Date:sale.Date, InvoiceNo:no, CustomerID:sale.CustomerID||'',
      CustomerName:sale.CustomerName||'', Amount:bal, Paid:0, Balance:bal, Status:'Due', Note:'' });
  }
  return { invoiceNo:no, subtotal:subtotal, discount:discount, delivery:delivery, total:net, profit:sale.Profit, received:Math.min(received,net), due:Math.max(bal,0) };
}
/* payment state of a sale (Paid / Partial / Due), worked out from the open due rows */
function payInfo(){
  const bal={}; DB.Dues.forEach(function(d){ const k=String(d.InvoiceNo); bal[k]=(bal[k]||0)+num(d.Balance); });
  return function(s){
    const net=saleNet(s), due=Math.min(Math.max(bal[String(s.InvoiceNo)]||0,0),Math.max(net,0)), rec=net-due;
    return { net:net, due:due, received:rec, state: due<=0 ? 'Paid' : (rec<=0 ? 'Due' : 'Partial') };
  };
}
/* one summary line per customer for the Buyer directory */
const DELIVER_OPTS=[['','— (none)'],['3 days','3 days'],['1 week','1 week'],['2 weeks','2 weeks'],['3 weeks','3 weeks'],['1 month','1 month']];
function deliverDays(l){ return ({'3 days':3,'1 week':7,'2 weeks':14,'3 weeks':21,'1 month':30})[l]||0; }
function ymdLocal(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function deliverBy(dateISO,label){ const n=deliverDays(label); if(!n||!dateISO) return ''; const d=new Date(dateISO); if(isNaN(d)) return ''; d.setDate(d.getDate()+n); return ymdLocal(d); }
function delOptsHtml(sel){ return DELIVER_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+((sel||'')===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join(''); }
function delChip(s){
  if(!s || !s.DeliverAfter || (s.Status||'Delivered')!=='Pending') return '';
  const late = s.DeliverBy && s.DeliverBy < ymdLocal(new Date());
  return '<span class="pill '+(late?'warn':'amber')+'">🚚 Delivery after '+esc(s.DeliverAfter)+(s.DeliverBy?(late?' · overdue':' · by '+fdate(s.DeliverBy)):'')+'</span>';
}
function L_customerSummary(){
  const pi=payInfo(), out={};
  DB.Sales.forEach(function(s){
    const id=String(s.CustomerID||''); if(!id) return;
    const o=out[id]||(out[id]={orders:0,net:0,due:0,pre:0,prePending:0,pending:0}); const x=pi(s);
    o.orders++; o.net+=x.net; o.due+=x.due;
    if(s.Preorder){ o.pre++; if(s.Status==='Pending') o.prePending++; }
    if(s.Status==='Pending'){ o.pending++; if(s.DeliverAfter && (!o.del || (s.DeliverBy||'9')<(o.del.DeliverBy||'9'))) o.del={DeliverAfter:s.DeliverAfter, DeliverBy:s.DeliverBy||'', Status:'Pending'}; }
  });
  Object.keys(out).forEach(function(id){ const o=out[id]; o.state = o.due<=0 ? 'Paid' : (o.due>=o.net ? 'Due' : 'Partial'); });
  return out;
}
function L_customerHistory(id){
  const sales = readAll('Sales').filter(function(s){ return String(s.CustomerID)===String(id); })
    .sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); });
  const pi=payInfo();
  sales.forEach(function(s){ const x=pi(s); s.PayState=x.state; s.DueAmt=x.due; s.PaidAmt=x.received; });
  let spent=0, prof=0; sales.forEach(function(s){ spent+=saleNet(s); prof+=num(s.Profit); });
  let due=0; DB.Dues.forEach(function(d){ if(String(d.CustomerID)===String(id)) due+=num(d.Balance); });
  return { sales:sales, orders:sales.length, totalSpent:spent, totalProfit:prof, due:due };
}

/* ---------- Dashboard ---------- */
function L_dashboard(){
  const sales=DB.Sales, products=DB.Products, returns=DB.Returns, dues=DB.Dues;
  const todayStr=dstr(new Date()), yr=String(new Date().getFullYear());
  let tSales=0,tProfit=0,tOrders=0,allSales=0,allProfit=0; const monthly={};
  const curMK=ym(new Date()); const _pd=new Date(); const prevMK=ym(new Date(_pd.getFullYear(),_pd.getMonth()-1,1));
  let monProfit=0, prevMonProfit=0; const preMonth={count:0,pending:0,delivered:0,amount:0};
  sales.forEach(function(s){
    if(s.Preorder && ym(s.Date)===curMK){ preMonth.count++; preMonth.amount+=saleNet(s); if(s.Status==='Pending') preMonth.pending++; else preMonth.delivered++; }
    const total=saleNet(s), pf=num(s.Profit);
    allSales+=total; allProfit+=pf;
    if(dstr(s.Date)===todayStr){ tSales+=total; tProfit+=pf; tOrders++; }
    const mk=ym(s.Date); if(mk===curMK) monProfit+=pf; else if(mk===prevMK) prevMonProfit+=pf;
    if(yy(s.Date)===yr){ monthly[mk]=(monthly[mk]||0)+total; }
  });
  let tRet=0,tRetProfit=0,allRet=0,allRetProfit=0;
  returns.forEach(function(r){
    const amt=num(r.Amount), rp=num(r.ProfitReversed);
    allRet+=amt; allRetProfit+=rp;
    if(dstr(r.Date)===todayStr){ tRet+=amt; tRetProfit+=rp; }
    const rmk=ym(r.Date); if(rmk===curMK) monProfit-=rp; else if(rmk===prevMK) prevMonProfit-=rp;
    if(yy(r.Date)===yr){ monthly[rmk]=(monthly[rmk]||0)-amt; }
  });
  let outstandingDue=0; dues.forEach(function(x){ outstandingDue+=num(x.Balance); });
  const totalStock=products.reduce(function(s,p){ return s+num(p.Stock); },0);
  const recent=readAll('Sales').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }).slice(0,8);
  const low=readAll('Products').filter(function(p){ return num(p.Stock)<=LOW_STOCK; });
  return {
    today:{ sales:tSales-tRet, profit:tProfit-tRetProfit, orders:tOrders, returns:tRet },
    allTime:{ sales:allSales-allRet, profit:allProfit-allRetProfit, orders:sales.length, returns:allRet },
    outstandingDue:outstandingDue, totalStock:totalStock, monthProfit:monProfit, prevMonthProfit:prevMonProfit, preMonth:preMonth,
    year:yr, monthly:monthly, recent:recent,
    lowStock:low, productCount:products.length, customerCount:DB.Customers.length
  };
}

/* ---------- Report ---------- */
function L_report(from, to){
  const sales=DB.Sales, items=DB.SaleItems, products=DB.Products;
  const brandOf={}; products.forEach(function(p){ brandOf[p.ID]=p.Brand||'—'; });
  function inRange(v){ const ds=dstr(v); if(from && ds<from) return false; if(to && ds>to) return false; return true; }
  const S=sales.filter(function(s){ return s.Date && inRange(s.Date); });
  const invSet={}; S.forEach(function(s){ invSet[s.InvoiceNo]=true; });
  const I=items.filter(function(it){ return invSet[it.InvoiceNo]; });
  let totalSales=0,totalProfit=0,totalDiscount=0,totalDelivery=0,subtotal=0;
  S.forEach(function(s){ totalSales+=saleNet(s); totalProfit+=num(s.Profit); totalDiscount+=num(s.Discount); totalDelivery+=num(s.Delivery); subtotal+=num(s.Subtotal); });
  let itemsSold=0,cogs=0; I.forEach(function(it){ itemsSold+=num(it.Qty); cogs+=num(it.Qty)*num(it.BuyPrice); });
  const orders=S.length;
  const retRows=DB.Returns.filter(function(r){ return r.Date && inRange(r.Date); });
  let retAmount=0,retProfit=0; retRows.forEach(function(r){ retAmount+=num(r.Amount); retProfit+=num(r.ProfitReversed); });
  const netSales=totalSales-retAmount, netProfit=totalProfit-retProfit;
  const pAgg={}; I.forEach(function(it){ const k=it.ProductID||it.ProductName;
    if(!pAgg[k]) pAgg[k]={name:it.ProductName, brand:brandOf[it.ProductID]||'—', qty:0, revenue:0, profit:0};
    pAgg[k].qty+=num(it.Qty); pAgg[k].revenue+=num(it.LineTotal); pAgg[k].profit+=num(it.LineProfit); });
  const bestSellers=Object.keys(pAgg).map(function(k){return pAgg[k];}).sort(function(a,b){return b.qty-a.qty;});
  const bAgg={}; I.forEach(function(it){ const b=brandOf[it.ProductID]||'—';
    if(!bAgg[b]) bAgg[b]={brand:b, qty:0, revenue:0, profit:0};
    bAgg[b].qty+=num(it.Qty); bAgg[b].revenue+=num(it.LineTotal); bAgg[b].profit+=num(it.LineProfit); });
  const byBrand=Object.keys(bAgg).map(function(k){return bAgg[k];}).sort(function(a,b){return b.revenue-a.revenue;});
  const cAgg={}; S.forEach(function(s){ const k=s.CustomerName||'Walk-in';
    if(!cAgg[k]) cAgg[k]={name:k, orders:0, spent:0, profit:0};
    cAgg[k].orders++; cAgg[k].spent+=saleNet(s); cAgg[k].profit+=num(s.Profit); });
  const byCustomer=Object.keys(cAgg).map(function(k){return cAgg[k];}).sort(function(a,b){return b.spent-a.spent;});
  const pay={}; S.forEach(function(s){ const k=s.Payment||'Cash'; pay[k]=(pay[k]||0)+saleNet(s); });
  const thisYear=new Date().getFullYear();
  const cur=[],prev=[],prof=[]; for(let i=0;i<12;i++){ cur.push(0); prev.push(0); prof.push(0); }
  sales.forEach(function(s){ if(!s.Date) return; const y=new Date(s.Date).getFullYear(), m=new Date(s.Date).getMonth();
    if(y===thisYear){ cur[m]+=saleNet(s); prof[m]+=num(s.Profit); } else if(y===thisYear-1){ prev[m]+=saleNet(s); } });
  DB.Returns.forEach(function(r){ if(!r.Date) return; const y=new Date(r.Date).getFullYear(), m=new Date(r.Date).getMonth();
    if(y===thisYear){ cur[m]-=num(r.Amount); prof[m]-=num(r.ProfitReversed); } else if(y===thisYear-1){ prev[m]-=num(r.Amount); } });
  /* pre-orders: totals for the chosen range + a month-by-month count for this year */
  const preInv={}; let preCount=0, prePending=0, preAmount=0, costPending=0;
  S.forEach(function(x){ if(x.Preorder){ preInv[x.InvoiceNo]=true; preCount++; preAmount+=saleNet(x); if(x.Status==='Pending') prePending++; } });
  I.forEach(function(it){ if(preInv[it.InvoiceNo] && num(it.BuyPrice)<=0) costPending++; });
  const preDel=[],prePen=[],preAmt=[]; for(let i=0;i<12;i++){ preDel.push(0); prePen.push(0); preAmt.push(0); }
  sales.forEach(function(x){ if(!x.Preorder||!x.Date) return; const d=new Date(x.Date);
    if(d.getFullYear()===thisYear){ const m=d.getMonth(); preAmt[m]+=saleNet(x); if(x.Status==='Pending') prePen[m]++; else preDel[m]++; } });
  return {
    range:{from:from||null,to:to||null},
    summary:{ totalSales:netSales, totalProfit:netProfit, grossSales:totalSales, returns:retAmount, retProfit:retProfit,
      orders:orders, itemsSold:itemsSold, totalDiscount:totalDiscount, totalDelivery:totalDelivery, cogs:cogs, subtotal:subtotal,
      avgOrder:orders?netSales/orders:0, avgProfit:orders?netProfit/orders:0, margin:netSales?(netProfit/netSales*100):0 },
    bestSellers:bestSellers, byBrand:byBrand, byCustomer:byCustomer, byPayment:pay,
    yoy:{ year:thisYear, cur:cur, prev:prev, profit:prof },
    preorder:{ count:preCount, pending:prePending, delivered:preCount-prePending, amount:preAmount, costPending:costPending, monthlyDelivered:preDel, monthlyPending:prePen, monthlyAmount:preAmt }
  };
}

/* ---------- Purchases ---------- */
function L_createPurchase(pur, items){
  items=items||[]; const no=nextNo('Purchases','PO'); const now=new Date(); let total=0;
  items.forEach(function(it){ const qty=num(it.Qty), bp=num(it.BuyPrice); it.LineTotal=qty*bp; total+=it.LineTotal;
    const p=findProduct(it.ProductID); if(p){ p.Stock=num(p.Stock)+qty; if(bp>0) p.BuyPrice=bp; }
    addLot(it.ProductID, bp, qty, no); });
  const paid=num(pur.Paid), due=total-paid;
  DB.Purchases.push({ PurchaseNo:no, Date:now.toISOString(), SupplierID:pur.SupplierID||'', SupplierName:pur.SupplierName||'',
    Total:total, Paid:paid, Due:due, Status:(due<=0?'Paid':'Due'), Note:pur.Note||'' });
  items.forEach(function(it){ DB.PurchaseItems.push({ PurchaseNo:no, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
    Qty:num(it.Qty), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal }); });
  return { purchaseNo:no, total:total, paid:paid, due:due };
}
function L_listPurchases(){ return readAll('Purchases').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_getPurchase(no){
  return { purchase: DB.Purchases.filter(function(x){return String(x.PurchaseNo)===String(no);}).map(function(r){return Object.assign({},r);})[0]||null,
           items: DB.PurchaseItems.filter(function(i){return String(i.PurchaseNo)===String(no);}).map(function(r){return Object.assign({},r);}) };
}
function L_updatePurchasePayment(no, paid){
  const i=rowIndex('Purchases',no); if(i<0) return {error:'not found'};
  const row=DB.Purchases[i]; const total=num(row.Total), p=num(paid), due=total-p;
  row.Paid=p; row.Due=due; row.Status=(due<=0?'Paid':'Due'); return { paid:p, due:due };
}

/* ---------- Returns & Dues ---------- */
function L_createReturn(ret, items){
  items=items||[]; const no=nextNo('Returns','RT'); const now=new Date(); let amount=0, profitRev=0;
  items.forEach(function(it){ const qty=num(it.Qty), sp=num(it.SalePrice), bp=num(it.BuyPrice);
    it.LineTotal=qty*sp; it.LineProfit=qty*(sp-bp); amount+=it.LineTotal; profitRev+=it.LineProfit;
    const p=findProduct(it.ProductID); if(p) p.Stock=num(p.Stock)+qty;
    addLot(it.ProductID, bp, qty, ''); });
  DB.Returns.push({ ReturnNo:no, Date:now.toISOString(), InvoiceNo:ret.InvoiceNo||'', CustomerName:ret.CustomerName||'',
    Amount:amount, ProfitReversed:profitRev, Note:ret.Note||'' });
  items.forEach(function(it){ DB.ReturnItems.push({ ReturnNo:no, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
    Qty:num(it.Qty), SalePrice:num(it.SalePrice), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal, LineProfit:it.LineProfit }); });
  return { returnNo:no, amount:amount, profitReversed:profitRev };
}
function L_listReturns(){ return readAll('Returns').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_listDues(){ return readAll('Dues').filter(function(d){ return num(d.Balance)>0; }).sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_payDue(id, amount){
  const i=rowIndex('Dues',id); if(i<0) return {error:'not found'};
  const row=DB.Dues[i]; const amt=num(row.Amount); const paidNow=num(row.Paid)+num(amount); const bal=amt-paidNow;
  row.Paid=paidNow; row.Balance=bal; row.Status=(bal<=0?'Paid':'Due'); return { paid:paidNow, balance:bal };
}

/* ---------- Firebase sync layer (Vol 7) ----------
   Everything still runs against the in-memory DB above. Firestore is now the source of truth:
   one collection per table, live listeners keep DB up to date on every device, and each change
   is written to Firestore as a small diff (never the whole DB). Stock and lot quantities are
   written as increments so two devices selling at the same time cannot overwrite each other. */
const CHILD = { SaleItems:'InvoiceNo', PurchaseItems:'PurchaseNo', ReturnItems:'ReturnNo' }; // rows that share a parent number
const INC_FIELD = { Products:'Stock', Lots:'Qty' };
const SEQ_TABLES = ['Sales','Purchases','Returns'];
const SEQ_ACTION = { createSale:'Sales', createPurchase:'Purchases', createReturn:'Returns' };
const CLAIM = {};          // numbers claimed from the shared counter, consumed by nextNo()
const PENDING_INC = [];    // counters to bump later when a number had to be taken offline
let fdb = null, fauth = null;
let SHADOW = {};           // what Firestore is known to hold, per table: Map(docId -> row)
let CFG = {};              // shop info (invoice header/footer), stored in Firestore meta/shop
let SERVER_SEEN = false;   // true once Products were confirmed from the server, not only the cache
let BOOTED = false, SYNC_STARTED = false;
let UNSUBS = [];

function getCfg(){ return CFG || {}; }
function setCfg(c){
  CFG = c;
  if(fdb) fdb.collection('meta').doc('shop').set(cleanRow(c)).catch(function(e){ toast('Sync problem: '+((e&&e.message)||e),'err'); });
}

function cleanRow(r){ return JSON.parse(JSON.stringify(r)); }
function keyOf(t, r){ return CHILD[t] ? r._k : r[KEY[t]]; }

/* child rows (sale items etc.) share their parent's number, so each gets its own id: "<no>#001" */
function assignChildKeys(target){
  Object.keys(CHILD).forEach(function(t){
    const pk = CHILD[t], cnt = {}, rows = target[t] || [];
    rows.forEach(function(r){ if(r._k){ const n = parseInt(String(r._k).split('#')[1], 10) || 0; cnt[r[pk]] = Math.max(cnt[r[pk]] || 0, n); } });
    rows.forEach(function(r){ if(!r._k){ cnt[r[pk]] = (cnt[r[pk]] || 0) + 1; r._k = r[pk] + '#' + ('000' + cnt[r[pk]]).slice(-3); } });
  });
}
function sortRows(t, rows){
  if(CHILD[t]) rows.sort(function(a,b){ return String(a._k||'').localeCompare(String(b._k||'')); });
  else rows.sort(function(a,b){ return String(a.CreatedAt||a.Date||'').localeCompare(String(b.CreatedAt||b.Date||'')); });
}
function makeShadow(t, rows){
  const m = new Map();
  rows.forEach(function(r){ const k = keyOf(t, r); if(k != null && k !== '') m.set(String(k), cleanRow(r)); });
  return m;
}

/* Compare DB with what Firestore holds and send only the differences. Runs synchronously up to the
   commit, so a second change made right after the first is diffed against the updated shadow. */
async function persist(){
  if(!fdb) return;
  assignChildKeys(DB);
  const FV = firebase.firestore.FieldValue;
  let batch = fdb.batch(), n = 0; const batches = [];
  function add(fn){ fn(batch); n++; if(n >= 400){ batches.push(batch); batch = fdb.batch(); n = 0; } }
  TABLES.forEach(function(t){
    const col = fdb.collection(t), sh = SHADOW[t] || (SHADOW[t] = new Map()), seen = new Set();
    DB[t].forEach(function(r){
      const k = keyOf(t, r); if(k == null || k === '') return;
      const id = String(k); seen.add(id);
      const prev = sh.get(id);
      if(!prev){ add(function(b){ b.set(col.doc(id), cleanRow(r)); }); return; }
      const upd = {}; let changed = false;
      Object.keys(r).forEach(function(f){
        if(JSON.stringify(r[f]) === JSON.stringify(prev[f])) return;
        changed = true;
        if(INC_FIELD[t] === f && typeof r[f] === 'number' && typeof prev[f] === 'number') upd[f] = FV.increment(r[f] - prev[f]);
        else upd[f] = (r[f] === undefined ? null : r[f]);
      });
      if(changed) add(function(b){ b.set(col.doc(id), upd, {merge:true}); });
    });
    sh.forEach(function(_, id){ if(!seen.has(id)) add(function(b){ b.delete(col.doc(id)); }); });
    SHADOW[t] = makeShadow(t, DB[t]);
  });
  PENDING_INC.splice(0).forEach(function(t){
    const o = {}; o[t] = FV.increment(1);
    add(function(b){ b.set(fdb.collection('meta').doc('counters'), o, {merge:true}); });
  });
  batches.push(batch);
  batches.forEach(function(b){ b.commit().catch(function(e){ toast('Sync problem: '+((e&&e.message)||e),'err'); }); });
}

/* Invoice / PO / return numbers come from one shared counter so two devices never reuse a number. */
async function claimSeq(table){
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  try{
    const ref = fdb.collection('meta').doc('counters');
    return await fdb.runTransaction(async function(tx){
      const s = await tx.get(ref);
      const cur = (s.exists && Number(s.data()[table])) || 0;
      const o = {}; o[table] = cur + 1; tx.set(ref, o, {merge:true});
      return cur + 1;
    });
  }catch(e){ return null; }
}

/* live listeners: every collection + counters + shop info. Resolves when all have delivered once. */
function listenAll(){
  const waits = [];
  function watch(ref, onData){
    waits.push(new Promise(function(resolve, reject){
      let first = true;
      UNSUBS.push(ref.onSnapshot(function(snap){
        onData(snap);
        if(first){ first = false; resolve(); } else scheduleRefresh();
      }, function(err){
        if(first){ first = false; reject(err); } else toast('Sync problem: '+((err&&err.message)||err),'err');
      }));
    }));
  }
  TABLES.forEach(function(t){
    watch(fdb.collection(t), function(snap){
      const rows = snap.docs.map(function(d){ return d.data(); });
      sortRows(t, rows);
      DB[t] = rows; SHADOW[t] = makeShadow(t, rows);
      if(t === 'Products' && !snap.metadata.fromCache) SERVER_SEEN = true;
    });
  });
  watch(fdb.collection('meta').doc('counters'), function(s){ DB._seq = s.exists ? Object.assign({}, s.data()) : {}; });
  watch(fdb.collection('meta').doc('shop'), function(s){ CFG = s.exists ? s.data() : {}; });
  return Promise.all(waits);
}

/* re-draw the current screen when another device changes data (never while typing or in a popup) */
let refreshT = null;
function scheduleRefresh(){
  if(!BOOTED) return;
  clearTimeout(refreshT);
  refreshT = setTimeout(function(){
    if($('#backdrop').classList.contains('on')) return;
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;

  }, 700);
}

/* ---------- old local data (Vol 6 kept everything in this browser's IndexedDB) ---------- */
const IDB_NAME='ommes_local_v1', IDB_STORE='kv', IDB_KEY='db';
function idbOpen(){ return new Promise(function(res,rej){ const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
  r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
async function idbGet(){ const db=await idbOpen(); return new Promise(function(res,rej){
  const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(IDB_KEY);
  t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ rej(t.error); }; }); }
async function findLegacyData(){
  try{ const old = await idbGet(); if(old && TABLES.some(function(t){ return Array.isArray(old[t]) && old[t].length; })) return old; }catch(e){}
  return null;
}
function legacyCfg(){ try{ return JSON.parse(localStorage.getItem('omme_cfg_v1') || 'null') || null; }catch(e){ return null; } }
function legacyCounts(o){ return (o.Products||[]).length+' products · '+(o.Customers||[]).length+' customers · '+(o.Sales||[]).length+' sales'; }

/* Copy a whole backup (or the old local data) into Firestore. Safe to run twice: same ids overwrite. */
async function uploadToCloud(obj){
  if(typeof navigator !== 'undefined' && navigator.onLine === false) throw new Error('Internet connection is needed for this');
  const src = {};
  TABLES.forEach(function(t){ src[t] = Array.isArray(obj[t]) ? obj[t].map(cleanRow) : []; });
  assignChildKeys(src);
  let batch = fdb.batch(), n = 0, total = 0; const batches = [];
  TABLES.forEach(function(t){
    src[t].forEach(function(r){
      const k = keyOf(t, r); if(k == null || k === '') return;
      batch.set(fdb.collection(t).doc(String(k)), r); total++; n++;
      if(n >= 400){ batches.push(batch); batch = fdb.batch(); n = 0; }
    });
  });
  batches.push(batch);
  for(let i = 0; i < batches.length; i++) await batches[i].commit();
  const seq = obj._seq || {}, ref = fdb.collection('meta').doc('counters');
  await fdb.runTransaction(async function(tx){
    const s = await tx.get(ref), cur = s.exists ? s.data() : {}, o = {};
    SEQ_TABLES.forEach(function(t){ o[t] = Math.max(Number(cur[t]) || 0, Number(seq[t]) || 0, src[t].length); });
    tx.set(ref, o, {merge:true});
  });
  return total;
}
async function runMigration(){
  closeModal();
  if((DB.Products.length || DB.Sales.length || DB.Customers.length) &&
     !confirm('Firebase already has shop data.\n\nUploading the old local data will overwrite any record with the same id (for example a stock count you changed since).\n\nContinue?')) return;
  toast('Uploading your old data…');
  try{
    const old = await findLegacyData();
    if(!old){ toast('No old local data found in this browser','err'); return; }
    const n = await uploadToCloud(old);
    const lc = legacyCfg(); if(lc && !Object.keys(CFG || {}).length) setCfg(lc);
    localStorage.setItem('omme_migrated','1');
    toast(n+' records uploaded ✦','ok');
    setNav(state.view);
  }catch(e){ toast('Upload failed: '+e.message,'err'); }
}
async function offerMigration(){
  try{

/* ---------- login + start-up ---------- */
function setScreen(s){
  $('#splash').style.display = (s === 'splash') ? 'grid' : 'none';
  $('#login').classList.toggle('on', s === 'login');
  $('#app').style.display = (s === 'app') ? 'block' : 'none';
}
function loginMsg(m){ const e = $('#lg-err'); if(e) e.textContent = m || ''; }
function authErrorText(e){
  const c = (e && e.code) || '';
  if(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') return 'Email or password is not correct.';
  if(c === 'auth/invalid-email') return 'Please enter a valid email address.';
  if(c === 'auth/too-many-requests') return 'Too many attempts. Wait a few minutes and try again.';
  if(c === 'auth/network-request-failed') return 'No internet connection.';
  if(c === 'auth/user-disabled') return 'This account has been disabled.';
  return 'Could not sign in: ' + ((e && e.message) || e);
}
function doLogin(){
  const email = $('#lg-email').value.trim(), pass = $('#lg-pass').value;
  if(!email || !pass){ loginMsg('Enter your email and password.'); return; }
  const btn = $('#lg-btn'); btn.disabled = true; btn.textContent = 'Signing in…'; loginMsg('');
  fauth.signInWithEmailAndPassword(email, pass).catch(function(e){ loginMsg(authErrorText(e)); })
    .then(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
}
function doSignOut(){ if(fauth) fauth.signOut().then(function(){ location.reload(); }); }

async function onAuth(user){
  if(!user){ SYNC_STARTED = false; setScreen('login'); return; }
  if(SYNC_STARTED) return;
  SYNC_STARTED = true;
  setScreen('splash');
  const slow = setTimeout(function(){ const m = $('#splash-msg'); if(m) m.textContent = 'Still loading… check your internet connection.'; }, 12000);
  try{ await listenAll(); }
  catch(e){
    clearTimeout(slow);
    UNSUBS.forEach(function(u){ try{ u(); }catch(x){} }); UNSUBS = [];
    SYNC_STARTED = false;
    const denied = e && e.code === 'permission-denied';
    try{ await fauth.signOut(); }catch(x){}
    setScreen('login');
    loginMsg(denied ? 'This account is not allowed to open this app. Ask the admin to add your email.' : 'Could not load data: ' + ((e && e.message) || e));
    return;
  }
  clearTimeout(slow);
  BOOTED = true;
  boot();
  offerMigration();
}

async function startFirebase(){
  const bad = (typeof FIREBASE_CONFIG === 'undefined') || !FIREBASE_CONFIG.apiKey || /^PASTE/i.test(FIREBASE_CONFIG.apiKey);
  if(bad){ setScreen('login'); loginMsg('Firebase is not set up yet. Fill in firebase-config.js (see README).'); return; }
  if(typeof firebase === 'undefined'){ setScreen('login'); loginMsg('Could not load Firebase. Check your internet connection and reload.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  fauth = firebase.auth(); fdb = firebase.firestore();
  try{ await fdb.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* private window or unsupported: works online only */ }
  fauth.onAuthStateChanged(onAuth);
}

  box.innerHTML = h || '<div class="gs-none">Kichu pawa gelo na — onno bhabe likhe dekhun.</div>';

function animateTiles(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.tile').forEach(function(t){ t.classList.add('in'); });
  document.querySelectorAll('.tile .tv').forEach(function(el){
    const to=Number(el.getAttribute('data-count'))||0;
    const plain=el.hasAttribute('data-plain'), fmt=function(v){ return plain?String(v):tk(v); };
    if(reduce || to===0){ el.textContent=fmt(to); return; }
    const dur=750, t0=performance.now();
    function step(now){
      const p=Math.min((now-t0)/dur,1);
      const e=1-Math.pow(1-p,3); // easeOutCubic
      el.textContent=fmt(Math.round(to*e));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function drawChart(months){
  const el=document.getElementById('mchart'); if(!el||!window.Chart) return;
  if(state.chart){ state.chart.destroy(); }
  const ctx=el.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const cv=function(n,d){ return (cs.getPropertyValue(n)||'').trim()||d; };
  const mut=cv('--d-muted','#a99fc4'), grid=cv('--d-grid','rgba(255,255,255,.07)');
  const grad=ctx.createLinearGradient(0,0,0,180);
  grad.addColorStop(0,cv('--j-gold1','#f9b233')); grad.addColorStop(1,cv('--j-gold2','#e0592b'));
  state.chart=new Chart(el,{
    type:'bar',
    data:{ labels:months.map(m=>m.label),
      datasets:[{ data:months.map(m=>m.val), backgroundColor:grad, hoverBackgroundColor:'#ffd27a', borderRadius:7, maxBarThickness:34 }]},
    options:{ animation:{duration:800}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>tk(c.raw)}}},
      scales:{ y:{ticks:{callback:v=>v>=1000?(v/1000)+'k':v, color:mut}, grid:{color:grid}},
               x:{ticks:{color:mut}, grid:{display:false}} } }
  });
}

function saleEditRead(){
  const edits={}; let subtotal=0, kept=0, cost=0;
  document.querySelectorAll('.se-q').forEach(q=>{
    const k=q.dataset.k, sel=function(c){ return document.querySelector('.'+c+'[data-k="'+k.replace(/"/g,'\\"')+'"]'); };
    const p=sel('se-p'), b=sel('se-b');
    const qty=Math.max(0,Number(q.value)||0), price=Math.max(0,Number(p?p.value:0)||0), buy=Math.max(0,Number(b?b.value:0)||0);
    edits[k]={Qty:qty, SalePrice:price, BuyPrice:buy}; subtotal+=qty*price; cost+=qty*buy; if(qty>0) kept++;
  });
  const disc=Number($('#se-disc').value)||0, deliv=Number($('#se-deliv').value)||0, recv=Number($('#se-recv').value)||0;
  return { edits, kept, subtotal, disc, deliv, recv, net:subtotal-disc, profit:subtotal-cost-disc };
}
function saleEditTotals(){
  const t=saleEditRead(), box=$('#se-tot'); if(!box) return;
  const due=Math.max(t.net-t.recv,0);
  box.innerHTML=`<div class="totline"><span>Subtotal</span><span class="tnum">${tk(t.subtotal)}</span></div>
    <div class="totline grand"><span>Total (hisab)</span><span class="v tnum">${tk(t.net)}</span></div>
    <div class="totline"><span>Profit</span><span class="tnum" style="color:${t.profit<0?'var(--neg)':'var(--pos)'};font-weight:700">${tk(t.profit)}</span></div>

    ${due>0?`<div class="totline"><span>Due</span><span class="tnum" style="color:var(--neg);font-weight:600">${tk(due)}</span></div>`:''}`;
}
