function syncStatus(){
  const pre=$('#s-pre'), da=$('#s-delafter'), st=$('#s-status'); if(!st) return;
  st.value = ((pre&&pre.checked)||(da&&da.value)) ? 'Pending' : 'Delivered';
}
function setPayMode(m){
  state.payMode=m;
  document.querySelectorAll('#s-paymode .seg-btn').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m')===m); });
  const box=$('#s-recv-box'), inp=$('#s-received'); if(!inp) return;
  box.style.display = m==='adv' ? '' : 'none';
  if(m==='full') inp.value=''; else if(m==='none') inp.value='0';
  else if(inp.value==='0') inp.value='';
  renderCart();
  if(m==='adv'){ try{ inp.focus(); }catch(e){} }
}
function renderCart(){
  const box=$('#cart-lines'); if(!box) return;
  if(!state.cart.length){ box.innerHTML='<div class="empty" style="padding:24px 0">Tap a product to add it.</div>'; }
  else{
    box.innerHTML=state.cart.map(i=>`
      <div class="cl">
        <div class="nm">${esc(i.name)}</div>
        <div class="lt tnum">${tk(i.qty*i.sale)}</div>
        <div class="qty">
          <button data-act="cart-dec" data-id="${esc(i.id)}">−</button>
          <span>${i.qty}</span>
          <button data-act="cart-inc" data-id="${esc(i.id)}">+</button>
        </div>
        <div style="text-align:right"><button class="rm" data-act="cart-del" data-id="${esc(i.id)}">✕ remove</button></div>
      </div>`).join('');
  }
  const t=cartTotals(); const tbox=$('#cart-tot');
  const recv=$('#s-received')?$('#s-received').value:'';
  const received = recv===''? t.total : (Number(recv)||0);
  const due = t.total - received;
  if(tbox) tbox.innerHTML=`
    <div class="totline"><span>Subtotal</span><span class="tnum">${tk(t.subtotal)}</span></div>
    <div class="totline"><span>Discount</span><span class="tnum">− ${tk(t.discount)}</span></div>
    <div class="totline grand"><span>Total (hisab)</span><span class="v tnum">${tk(t.total)}</span></div>
    <div class="totline" style="color:var(--muted)"><span>Delivery (invoice only)</span><span class="tnum">+ ${tk(t.delivery)}</span></div>
    ${t.delivery>0?`<div class="totline" style="color:var(--muted)"><span>Customer pays (invoice)</span><span class="tnum">${tk(t.payable)}</span></div>`:''}
    ${(recv!==''&&received>0&&due>0)?`<div class="totline"><span>Advance received</span><span class="tnum">${tk(received)}</span></div>`:''}
    ${(recv!==''&&due>0)?`<div class="totline"><span>Due (credit)</span><span class="tnum" style="color:var(--neg);font-weight:600">${tk(due)}</span></div>`:''}`;
}
function addToCart(id){
  const p=state.products.find(x=>String(x.ID)===String(id)); if(!p) return;
  const ex=state.cart.find(i=>i.id===p.ID);
  const inCart=ex?ex.qty:0;
  const stock=Number(p.Stock)||0;
  if(inCart+1>stock && !p.Preorder){
    if(stock<=0){ if(!confirm('"'+p.Name+'" এখন sold out (stock 0)। তবুও বিক্রি করবে? (stock মাইনাস হয়ে যাবে)')) return; }
    else if(!confirm('"'+p.Name+'" এর stock মাত্র '+stock+'টা। তবুও যোগ করবে?')) return;
  }
  if(ex) ex.qty++;
  else state.cart.push({ id:p.ID, name:p.Name, sale:Number(p.SalePrice)||0, buy:Number(p.BuyPrice)||0, qty:1 });
  if(p.Preorder){ const pc=$('#s-pre'); if(pc && !pc.checked){ pc.checked=true; pc.onchange&&pc.onchange(); } }
  renderCart();
}
function cartQty(id, d){
  const it=state.cart.find(i=>i.id===id); if(!it) return;
  it.qty+=d; if(it.qty<=0) state.cart=state.cart.filter(i=>i.id!==id);
  renderCart();
}
async function saveSale(){
  if(!state.cart.length){ toast('Cart is empty','err'); return; }
  const sel=$('#s-cust'); const cid=sel?sel.value:'';
  const cust=state.customers.find(c=>String(c.ID)===String(cid));
  const t=cartTotals();
  const recVal=$('#s-received')?$('#s-received').value:'';
  const sale={ CustomerID:cid, CustomerName:cust?cust.Name:'', Discount:t.discount, Delivery:t.delivery,
    Payment:$('#s-pay')?$('#s-pay').value:'Cash', Status:$('#s-status')?$('#s-status').value:'Delivered', Note:'',
    Preorder:!!($('#s-pre')&&$('#s-pre').checked), PreorderDate:($('#s-predate')?$('#s-predate').value:''),
    DeliverAfter:($('#s-delafter')?$('#s-delafter').value:''), Note:($('#s-note')?$('#s-note').value.trim():''),
    Paid: recVal===''? '' : (Number(recVal)||0) };
  const items=state.cart.map(i=>({ ProductID:i.id, ProductName:i.name, Qty:i.qty, SalePrice:i.sale, BuyPrice:i.buy }));
  const btn=document.querySelector('[data-act="sale-save"]'); if(btn){ btn.textContent='Saving…'; btn.disabled=true; }
  try{
    const r=await api('createSale',{sale, items});
    toast('Invoice '+r.invoiceNo+' saved'+(r.due>0?' · due '+tk(r.due):''),'ok');
    showInvoice({ InvoiceNo:r.invoiceNo, Date:new Date().toISOString(), CustomerName:sale.CustomerName, CustomerID:sale.CustomerID,
      Preorder:sale.Preorder, PreorderDate:sale.PreorderDate, Note:sale.Note, DeliverAfter:sale.DeliverAfter, Status:sale.Status,
      Subtotal:r.subtotal, Discount:r.discount, Delivery:r.delivery, Total:r.total, Payment:sale.Payment,
      Received:r.received, Due:r.due },
      state.cart.map(i=>({ProductName:i.name, Qty:i.qty, SalePrice:i.sale, LineTotal:i.qty*i.sale})));
    state.cart=[]; state.customerId='';
    state.products=await api('listProducts'); // refresh stock
    ['s-received','s-disc','s-deliv'].forEach(function(id){ const el=$('#'+id); if(el) el.value = id==='s-received'?'':'0'; });
    state.payMode='full'; setPayMode('full');
    const cs2=$('#s-cust'); if(cs2) cs2.value='';
    const dz=$('#s-delafter'); if(dz) dz.value=''; const nz=$('#s-note'); if(nz) nz.value='';
    const pc=$('#s-pre'); if(pc){ pc.checked=false; $('#s-predate-box').style.display='none'; $('#s-predate').value=''; $('#s-status').value='Delivered'; }
    renderProductList($('#pos-search')?$('#pos-search').value:''); renderCart();
  }catch(e){ toast(e.message,'err'); if(btn){ btn.textContent='Save & invoice'; btn.disabled=false; } }
}
async function reprint(inv){
  try{ const r=await api('getSale',{invoiceNo:inv}); if(r.sale) showInvoice(Object.assign({}, r.sale, {Received:r.received, Due:r.due}), r.items); }
  catch(e){ toast(e.message,'err'); }
}

function fdmy(iso){ const d=new Date(iso); return isNaN(d)?'':p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear(); }
function waNumber(ph){ const d=String(ph||'').replace(/\D/g,''); if(!d) return ''; if(d.indexOf('880')===0) return d; if(d.charAt(0)==='0') return '88'+d; return d; }
function showInvoice(sale, items){
  const cfg=getCfg()||{};
  const cust=DB.Customers.find(c=>String(c.ID)===String(sale.CustomerID))||{};
  const net=saleNet(sale), deliv=num(sale.Delivery), payable=net+deliv;
  const rec=num(sale.Received), due0=num(sale.Due);
  const pst = due0<=0 ? 'paid' : (rec<=0 ? 'cod' : 'adv');
  const paidShown = pst==='paid' ? payable : Math.min(rec,payable);
  const dueShown = Math.max(payable-paidShown,0);
  const rows=(items||[]).map((i,n)=>`<tr><td><span class="og-rowno">${n+1}</span></td><td>${esc(i.ProductName)}</td>
      <td class="r">${num(i.Qty)}</td><td class="r">${tk(i.SalePrice).replace('৳','')}</td><td class="r">${tk(i.LineTotal!==undefined?i.LineTotal:num(i.Qty)*num(i.SalePrice)).replace('৳','')}</td></tr>`);
  while(rows.length<4) rows.push(`<tr><td><span class="og-rowno">${rows.length+1}</span></td><td>&nbsp;</td><td class="r"></td><td class="r"></td><td class="r"></td></tr>`);
  const chip=(grp,v,label,on,radio)=>`<span class="og-chip ${on?'on':''}" data-act="og-chip" data-grp="${grp}" data-v="${v}" ${radio?'data-radio="1"':''}>${label}</span>`;
  const pm=String(sale.Payment||'Cash');
  const noteDef = [ sale.Preorder ? ('Pre-order'+(sale.PreorderDate?' · expected '+fdate(sale.PreorderDate):'')) : '',
    (sale.DeliverAfter && (sale.Status||'Delivered')==='Pending') ? ('Delivery after '+sale.DeliverAfter) : '', sale.Note||'' ].filter(Boolean).join(' · ');
  const web=cfg.shopWeb||'OMMESGALLERY.XYZ', wa=cfg.shopWhatsapp||'01534550063';
  const html=`
    <div class="ogi" id="invnode">
      <div class="og-head">
        <img class="og-logo" src="${OG_LOGO}" alt="">
        <div class="og-brand"><h1>OMME'S GALLERY</h1><div class="og-moto">Buy Your Happiness</div><div class="og-tag">100% Original Pakistani Dress</div></div>
        <div class="og-mark"><div class="og-word">INVOICE</div>
          <div class="og-no">NO. <b>${esc(sale.InvoiceNo)}</b></div><div class="og-no">DATE <b>${fdmy(sale.Date)}</b></div></div>
      </div>
      <div class="og-strip">Online Fashion Store &nbsp;·&nbsp; Shop Anytime At <b>${esc(web)}</b> &nbsp;·&nbsp; Home Delivery All Over Bangladesh</div>
      <div class="og-meta">
        <div><div class="og-eyebrow">Bill To</div>
          <div class="og-field"><label>Name</label><input id="og-name" value="${esc(cust.Name||sale.CustomerName||'')}"></div>
          <div class="og-field"><label>Mobile</label><input id="og-phone" value="${esc(cust.Phone||'')}"></div>
          <div class="og-field"><label>Address</label><input id="og-addr" value="${esc(cust.Address||'')}"></div></div>
        <div><div class="og-eyebrow">Delivery</div>
          <div class="og-chips">${chip('cr','redx','RedX',true,1)}${chip('cr','pathao','Pathao',false,1)}${chip('cr','uber','Uber',false,1)}</div>
          <div class="og-field" style="margin-top:9px"><label>Zone</label><input id="og-zone" placeholder="Inside / Outside Dhaka"></div>
          <div class="og-field"><label>Time</label><input id="og-time" placeholder="1–2 Days / 2–3 Days"></div></div>
      </div>
      <table><thead><tr><th>#</th><th>Item Description</th><th class="r" style="width:58px">Qty</th><th class="r" style="width:92px">Price Tk</th><th class="r" style="width:110px">Total Tk</th></tr></thead>
        <tbody>${rows.join('')}</tbody></table>
      <div class="og-totals">
        <div class="og-note"><div class="og-eyebrow">Note</div><textarea id="og-note" placeholder="Size, colour, or any special instruction…">${esc(noteDef)}</textarea></div>
        <div class="og-sums">
          <div class="og-sumrow"><span>Subtotal</span><strong>${tk(sale.Subtotal)}</strong></div>
          <div class="og-sumrow"><span>Delivery Charge</span><strong>${tk(deliv)}</strong></div>
          <div class="og-sumrow"><span>Discount (−)</span><strong>${tk(sale.Discount)}</strong></div>
          <div class="og-grand"><span>Total Payable</span><strong>${tk(payable)}</strong></div>
          <div class="og-sumrow"><span>Advance / Paid</span><strong>${tk(paidShown)}</strong></div>
          <div class="og-due"><span>Due</span><strong>${tk(dueShown)}</strong></div>
        </div>
      </div>
      <div class="og-pay">

function fitInvoice(){

  const z=Math.min(1,avail/794);

  w.style.width=Math.round(794*z)+'px'; w.style.height=Math.round(sc.offsetHeight*z)+'px';
}

/* The invoice is drawn off-screen at full A4 width, so the picture is the same on phone and laptop. */
async function invoiceCanvas(){
  const src=document.getElementById('invnode');
  if(!src || !window.html2canvas) throw new Error('nothing to render');
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;pointer-events:none';
  const clone=src.cloneNode(true); clone.removeAttribute('id');
  const a=src.querySelectorAll('input,textarea'), b=clone.querySelectorAll('input,textarea');
  a.forEach(function(el,i){ b[i].value=el.value; b[i].setAttribute('value',el.value); if(el.tagName==='TEXTAREA') b[i].textContent=el.value; if(!el.value) b[i].removeAttribute('placeholder'); });  // empty boxes stay blank in the picture
  holder.appendChild(clone); document.body.appendChild(holder);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    return await html2canvas(clone, { scale:2, backgroundColor:'#ffffff', useCORS:true });
  } finally { holder.remove(); }
}
let _invFile=null, _invT=null, _invGen=0;
function canvasBlob(c){ return new Promise(function(r){ c.toBlob(r,'image/jpeg',0.92); }); }
/* make the JPEG ready in the background, so Share can open straight away (phones need a fresh tap) */
function invPrepare(){
  clearTimeout(_invT); _invFile=null; const g=++_invGen, no=window._invNo;
  _invT=setTimeout(async function(){
    try{ const blob=await canvasBlob(await invoiceCanvas()); if(g===_invGen && blob) _invFile={blob:blob, name:'invoice-'+no+'.jpg'}; }catch(e){}
  }, 500);
}
function saveBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
}
async function shareInvoice(no){
  try{

    if(!f){ const blob=await canvasBlob(await invoiceCanvas()); f={blob:blob, name:'invoice-'+no+'.jpg'}; _invFile=f; }
    const file=new File([f.blob], f.name, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Invoice '+no, text:"OMME'S GALLERY — Invoice "+no });
      return;
    }

async function downloadInvoicePDF(no){
  try{
    const canvas=await invoiceCanvas();
    const img=canvas.toDataURL('image/jpeg', 0.95);
    const JS=(window.jspdf&&window.jspdf.jsPDF)?window.jspdf.jsPDF:(window.jsPDF);
    const pdf=new JS({ unit:'pt', format:'a4' });
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    let w=pw, h=canvas.height*(w/canvas.width); if(h>ph){ h=ph; w=canvas.width*(h/canvas.height); }
    pdf.addImage(img,'JPEG',(pw-w)/2,0,w,h);
    pdf.save('invoice-'+(no||'omme')+'.pdf');
    toast('PDF downloaded ✦','ok');
  }catch(e){ toast('Could not make PDF','err'); }
}

function repPresetRange(kind){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const f=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  if(kind==='month')     return {from:f(new Date(y,m,1)),   to:f(now),              preset:'month'};
  if(kind==='lastmonth') return {from:f(new Date(y,m-1,1)), to:f(new Date(y,m,0)),  preset:'lastmonth'};
  if(kind==='year')      return {from:f(new Date(y,0,1)),   to:f(now),              preset:'year'};
  return {from:'', to:'', preset:'all'};
}

function downloadCSV(name, header, rows){
  const q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv=[header.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ===================== CSV IMPORT (Products) ===================== */
function parseCSV(text){
  const lines=text.split(/\r?\n/);
  return lines.map(function(line){
    const cells=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
      else if(c===','&&!inQ){ cells.push(cur); cur=''; }
      else cur+=c;
    }
    cells.push(cur); return cells;
  });
}
function skuDupIndexes(items, existing){
  const existingSku={}; (existing||[]).forEach(function(p){ const s=(p.SKU||'').trim().toLowerCase(); if(s) existingSku[s]=true; });
  const seenInFile={}; const dup=[];
  items.forEach(function(it,idx){
    const s=(it.SKU||'').trim().toLowerCase(); if(!s) return;
    if(existingSku[s] || seenInFile[s]) dup.push(idx);
    seenInFile[s]=true;
  });
  return dup;
}
async function importProductsCSV(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(){
    try{
      const rows=parseCSV(String(reader.result)).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
      if(rows.length<2){ toast('CSV ফাঁকা বা শুধু header আছে','err'); input.value=''; return; }
      const hdrs=rows[0].map(function(h){ return h.trim().replace(/\s*\*$/,''); });
      const items=[];
      for(let i=1;i<rows.length;i++){
        const row=rows[i]; const item={};
        hdrs.forEach(function(h,j){ item[h]=(row[j]||'').trim(); });
        if(!item.Name) continue;
        items.push(item);
      }
      if(!items.length){ toast('কোনো valid product row পাওয়া যায়নি','err'); input.value=''; return; }

      let skipSet=null;
      try{
        const existing=await api('listProducts');
        const dupIdx=skuDupIndexes(items, existing);
        if(dupIdx.length){
          const sample=dupIdx.slice(0,8).map(function(i){ return items[i].SKU+(items[i].Name?' — '+items[i].Name:''); }).join('\n');
          const more=dupIdx.length>8?'\n…আরও '+(dupIdx.length-8)+'টা':'';
          const proceed=confirm(
            dupIdx.length+' টা SKU ইতিমধ্যে Inventory-তে আছে (বা এই CSV-তেই দুইবার আছে):\n\n'+sample+more+
            '\n\nOK চাপলে এগুলোও নতুন আলাদা entry হিসেবে import হবে।\nCancel চাপলে শুধু এই SKU-গুলো বাদ দিয়ে বাকি নতুন product-গুলো import হবে।'
          );
          if(!proceed){ skipSet={}; dupIdx.forEach(function(i){ skipSet[i]=true; }); }
        }
      }catch(e){ /* if the check itself fails, continue importing normally */ }

      let count=0, skipped=0;
      for(let i=0;i<items.length;i++){
        if(skipSet && skipSet[i]){ skipped++; continue; }
        await api('saveProduct',{item:items[i]});
        count++;
      }
      input.value='';
      toast(count+' টা product import হয়েছে'+(skipped?' · '+skipped+' টা duplicate SKU বাদ দেওয়া হয়েছে':'')+' ✦','ok');
      viewInventory();
    }catch(e){ toast('Import failed: '+e.message,'err'); input.value=''; }
  };
  reader.readAsText(file,'UTF-8');
}

/* ===================== SETTINGS ===================== */
function viewSettings(){
  const cfg=getCfg()||{};
  const curTheme=lsGet('omme_theme','mild'), curFont=lsGet('omme_font','lato');
  const light=[['mild','Mild','#f3efe7','#a9782f'],['deep','Deep','#d6c19a','#86561a'],['rose','Rose Blush','#fbe6ed','#b8326a'],
    ['peacock','Peacock Teal','#dff1ee','#0f766e'],['lavender','Lavender','#ece7fb','#6a47c9'],['sunset','Sunset','#ffeadb','#d2491f']];
  const darkT=[['dark','Dark','#1b1712','#a9782f'],['night','Night','#0a0908','#a9782f'],['midnight','Midnight Blue','#0b1220','#5f9bff'],
    ['plum','Plum Wine','#1a0d19','#e879b9'],['charcoal','Charcoal Gold','#131313','#d4a537']];
  const tbtn=t=>`<button class="seg-btn ${curTheme===t[0]?'on':''}" data-act="set-theme" data-theme="${t[0]}"><span class="sw" style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></span>${t[1]}</button>`;
  const fonts=[['lato','Lato'],['roboto','Roboto'],['poppins','Poppins'],['spartan','League Spartan'],['serif','Serif (Cormorant)']];
  $('#view').innerHTML=`
    <div class="view-head"><div><div class="eyebrow">Settings</div><h2>Shop settings</h2></div></div>
    <div class="card panel" style="margin-bottom:16px"><h3>Appearance <span class="count">this device only</span></h3>
      <div class="field"><label>Theme — light &amp; colourful</label><div class="seg">${light.map(tbtn).join('')}</div></div>
      <div class="field"><label>Theme — dark</label><div class="seg">${darkT.map(tbtn).join('')}</div></div>
      <div class="field" style="margin-bottom:0"><label>Font</label>
        <select id="set-font" class="fullsel" style="width:100%; padding:11px 12px; border:1px solid var(--line-2); border-radius:var(--radius-sm); background:var(--input-bg); color:var(--ink)">
          ${fonts.map(f=>`<option value="${f[0]}" ${curFont===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></div>
    </div>
    <div class="card panel" style="margin-bottom:16px"><h3>Shop info (shown on invoice)</h3>
      <div class="grid2">
        <div class="field"><label>Shop name</label><input id="set-name" value="${esc(cfg.shopName||"OMME'S GALLERY")}"></div>
        <div class="field"><label>Phone</label><input id="set-phone" value="${esc(cfg.shopPhone||'')}"></div></div>
      <div class="field"><label>Address</label><input id="set-addr" value="${esc(cfg.shopAddress||'')}"></div>
      <div class="field"><label>Invoice footer note</label><input id="set-note" value="${esc(cfg.invoiceNote||'Thank you for shopping with us. ✦ Buy your happiness.')}"></div>
      <button class="btn btn-gold" data-act="set-save">Save shop info</button></div>
    <div id="legacy-box"></div>
    <div class="card panel" style="margin-bottom:16px"><h3>Backup &amp; restore</h3>
      <p style="font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.55">Your data is saved in Firebase and shows on every signed-in device. A backup file is still a good safety copy: export one now and then and keep it on Google Drive. Importing a backup adds its records to the cloud data (same ids are overwritten).</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-gold" data-act="backup-export">⭳ Export backup</button>
        <button class="btn btn-ghost" data-act="backup-import">⭱ Import backup</button>
      </div>
      <input id="backup-file" type="file" accept="application/json,.json" style="display:none"></div>
    <div class="card panel"><h3>Account &amp; app</h3>
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px">Signed in as <strong>${esc((fauth&&fauth.currentUser&&fauth.currentUser.email)||'')}</strong></p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-ghost" data-act="signout">⎋ Sign out</button>
        <button class="btn btn-ghost install-btn" data-act="install" style="display:none">⤓ Install to home screen</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:12px 0 0">Online sync edition (Vol 7). Works offline too: changes are saved on this device and sent when the internet is back.</p></div>`;
  renderLegacyBox();
  if(deferredPrompt) showInstall(true);
  const bf=$('#backup-file'); if(bf) bf.onchange=()=>doImportBackup(bf);
  const ff=$('#set-font'); if(ff) ff.onchange=()=>applyFont(ff.value);
}
function saveShopInfo(){
  const cfg=getCfg()||{};
  cfg.shopName=$('#set-name').value.trim(); cfg.shopPhone=$('#set-phone').value.trim();
  cfg.shopAddress=$('#set-addr').value.trim(); cfg.invoiceNote=$('#set-note').value.trim();
  setCfg(cfg); toast('Saved','ok');
}
function doExportBackup(){
  try{
    const data=exportBackup();
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(); const p=n=>('0'+n).slice(-2);
    a.href=url; a.download='ommes-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Backup downloaded ✦','ok');
  }catch(e){ toast('Export failed: '+e.message,'err'); }
}
function doImportBackup(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(){
    try{
      const obj = importBackup(String(reader.result));
      const cnt = TABLES.reduce(function(a,t){ return a + (Array.isArray(obj[t]) ? obj[t].length : 0); }, 0);
      if(!confirm('Add '+cnt+' records from this backup to the cloud data?\n\nRecords with the same id will be overwritten.')){ input.value=''; return; }
      toast('Uploading backup…');
      await uploadToCloud(obj);
      toast('Backup imported ✦','ok');
      setNav('dashboard');
    }catch(e){ toast('Import failed: '+e.message,'err'); }
    input.value='';
  };
  reader.readAsText(file);
}

/* ===================== global click handling ===================== */
document.addEventListener('click', function(e){
  const nav=e.target.closest('[data-nav]'); if(nav){ closeModal(); setNav(nav.dataset.nav); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'install': doInstall(); break;
    case 'modal-close': closeModal(); break;
    case 'product-new': productForm(); break;
    case 'inv-csv-import': { const f=$('#inv-csv-file'); if(f){ f.onchange=()=>importProductsCSV(f); f.click(); } break; }
    case 'inv-toggle-soldout': state.hideSoldOut=!state.hideSoldOut; renderInventory($('#inv-search')?$('#inv-search').value:''); break;
    case 'product-edit': productForm(state.products.find(p=>String(p.ID)===String(id))); break;
    case 'product-save': saveProduct(id); break;
    case 'product-del': confirmDel('Delete this product?', ()=>api('deleteProduct',{id}).then(()=>{ toast('Deleted','ok'); viewInventory(); })); break;
    case 'customer-new': customerForm(); break;
    case 'customer-new-inline': customerForm(); window._afterCustSelect=true; break;
    case 'customer-edit': customerForm(state.customers.find(c=>String(c.ID)===String(id))); break;
    case 'customer-save': saveCustomer(id, window._afterCustSelect); window._afterCustSelect=false; break;
    case 'customer-hist': customerHistory(id); break;
    case 'cart-add': addToCart(id); break;
    case 'pay-mode': setPayMode(el.getAttribute('data-m')); break;
    case 'cart-inc': cartQty(id,1); break;
    case 'cart-dec': cartQty(id,-1); break;
    case 'cart-del': cartQty(id,-9999); break;
    case 'cart-clear': state.cart=[]; renderCart(); break;
    case 'sale-save': saveSale(); break;
    case 'sale-view': reprint(el.dataset.inv); break;
    case 'sale-edit': saleEditForm(el.dataset.inv, el.dataset.from, el.dataset.cid); break;
    case 'sale-edit-save': saveSaleEdit(el.dataset.inv); break;
    case 'inv-jpeg': downloadInvoiceJPEG(el.dataset.no); break;
    case 'inv-share': shareInvoice(el.dataset.no); break;
    case 'inv-wa': whatsappChat(el.dataset.no, el.dataset.pay); break;
    case 'og-chip': {
      const grp=el.dataset.grp;
      if(el.dataset.radio){ document.querySelectorAll('.og-chip[data-grp="'+grp+'"]').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
      else el.classList.toggle('on');
      invPrepare(); break; }
    case 'inv-pdf': downloadInvoicePDF(el.dataset.no); break;
    case 'rep-preset': repSetPreset(el.dataset.preset); break;
    case 'rep-apply': repApply(); break;
    case 'rep-export-sales': exportSales(); break;
    case 'rep-export-products': exportProducts(); break;
    case 'rep-export-brands': exportBrands(); break;
    case 'more-menu': moreMenu(); break;
    case 'exp-new': expenseForm(); break;
    case 'exp-edit': expenseForm((state.expData||[]).find(x=>String(x.ID)===String(id))); break;
    case 'exp-save': saveExpense(id); break;
    case 'exp-del': confirmDel('Delete this expense?', ()=>api('deleteExpense',{id}).then(()=>{ toast('Deleted','ok'); viewExpenses(); })); break;
    case 'sup-new': supplierForm(); break;
    case 'sup-new-inline': supplierForm(); break;
    case 'sup-edit': supplierForm((state.suppliers||[]).find(x=>String(x.ID)===String(id))); break;
    case 'sup-save': saveSupplier(id); break;
    case 'sup-del': confirmDel('Delete this supplier?', ()=>api('deleteSupplier',{id}).then(()=>{ toast('Deleted','ok'); state.suppliers=null; viewPurchases(); })); break;
    case 'pur-tab': state.purTab=el.dataset.tab; renderPurchases(); break;
    case 'pur-add': purAdd(id); break;
    case 'pur-inc': purQty(id,1); break;
    case 'pur-dec': purQty(id,-1); break;
    case 'pur-del': purQty(id,-9999); break;
    case 'pur-clear': state.purCart=[]; renderPurLines(); break;
    case 'pur-save': savePurchase(); break;
    case 'pur-view': viewPurchase(el.dataset.no); break;
    case 'pur-pay-save': savePurPayment(el.dataset.no); break;
    case 'cus-tab': state.custTab=el.dataset.tab; renderCustomers(''); break;
    case 'due-pay': duePayForm(id, Number(el.dataset.bal)||0, el.dataset.name||''); break;
    case 'due-pay-save': savePayDue(id); break;
    case 'set-save': saveShopInfo(); break;
    case 'set-theme': applyTheme(el.dataset.theme); viewSettings(); if(state.chart){ state.chart.destroy(); state.chart=null; } break;
    case 'backup-export': doExportBackup(); break;
    case 'backup-import': { const f=$('#backup-file'); if(f) f.click(); break; }
    case 'signout': doSignOut(); break;
    case 'migrate-yes': runMigration(); break;
  }
});
function confirmDel(msg, fn){
  openModal(`<div class="modal-head"><h3>Please confirm</h3><button class="x" data-act="modal-close">×</button></div>
    <div class="modal-body">${esc(msg)}</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-act="modal-close">Cancel</button>
    <button class="btn btn-danger" id="confirm-yes">Delete</button></div>`);
  $('#confirm-yes').onclick=()=>{ closeModal(); fn(); };
}

/* ===================== connect / boot ===================== */
function boot(){
  setScreen('app');
  setNav('dashboard');
}
/* ===================== PWA: install + offline ===================== */
let deferredPrompt=null;
function showInstall(v){ document.querySelectorAll('.install-btn').forEach(b=>b.style.display=v?'':'none'); }
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt=e; showInstall(true);
});
function doInstall(){
  if(!deferredPrompt){ toast('Use your browser menu ▸ “Install app / Add to Home Screen”'); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; showInstall(false); });
}
window.addEventListener('appinstalled', function(){ showInstall(false); toast('App installed ✦','ok'); });

/* iOS Safari can't auto-prompt — show a manual hint on the setup screen */
(function iosHint(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isIOS && !standalone){ const h=document.querySelector('.ios-hint'); if(h) h.style.display='block'; }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();  // always check for a newer service worker
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          // a new version has taken over — reload once to show it
          if(nw.state === 'activated' && navigator.serviceWorker.controller){
            if(!window.__reloadedForSW){ window.__reloadedForSW = true; location.reload(); }
          }
        });
      });
    }).catch(function(){ /* offline mode just won't be available */ });
    // if the controlling worker changes (new version), reload once
    var refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshed) return; refreshed = true; location.reload();
    });
  });
}

  ensureDB();
  $('#lg-form').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
  startFirebase();
})();
