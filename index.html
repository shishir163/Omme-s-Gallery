<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1610" />
<title>OMME'S GALLERY — Manager</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OMME'S" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1610; --charcoal:#2a2118; --paper:#f3efe7; --card:#ffffff;
    --line:#e7e0d3; --line-2:#d8cfbd;
    --gold:#a9782f; --gold-2:#c79a49; --gold-soft:#f4ead4;
    --muted:#8c8172; --muted-2:#b6ab99;
    --pos:#2f7d54; --pos-soft:#e6f1ea; --neg:#b23b3b; --neg-soft:#f7e7e5;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(27,22,16,.04), 0 8px 24px rgba(27,22,16,.06);
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Lato', 'Inter', system-ui, -apple-system, sans-serif;
    /* dashboard jewel palette (Pakistani festive dyes) */
    --d-bg:#0b0910; --d-bg2:#141020; --d-ink:#f4eefc; --d-muted:#a99fc4; --d-line:rgba(255,255,255,.09);
    --j-emerald1:#12b886; --j-emerald2:#0b7a63;
    --j-gold1:#f9b233; --j-gold2:#e0592b;
    --j-magenta1:#ff5c9b; --j-magenta2:#b12a8f;
    --j-indigo1:#7d7bff; --j-indigo2:#5127c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); font-weight:700; color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
  }
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit; font-weight:700; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:15px; font-weight:700}
  a{color:var(--gold)}

  /* ---------- wordmark ---------- */
  .brand{display:flex; flex-direction:column; gap:6px; line-height:1}
  .brand .name{font-family:var(--serif); font-weight:700; letter-spacing:.14em; font-size:26px}
  .brand .sub{align-self:flex-start; background:var(--muted); color:#fff; font-size:9px;
    letter-spacing:.34em; padding:3px 9px 2px; font-weight:600}
  .brand .tag{color:var(--muted); font-size:10.5px; letter-spacing:.02em; margin-top:2px}

  /* ---------- setup screen ---------- */
  #setup{min-height:100%; display:grid; place-items:center; padding:24px;
    background:radial-gradient(120% 90% at 50% -10%, #efe7d6 0%, var(--paper) 55%)}
  .setup-card{width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 28px}
  .setup-card .brand{align-items:center; text-align:center; margin-bottom:6px}
  .setup-card h1{font-family:var(--serif); font-weight:600; font-size:22px; text-align:center; margin:14px 0 2px}
  .setup-card p.lead{text-align:center; color:var(--muted); margin:0 0 20px; font-size:13.5px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--charcoal);
    letter-spacing:.02em; margin-bottom:6px}
  .field input, .field textarea, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line-2); border-radius:var(--radius-sm);
    background:#fdfcf9; color:var(--ink); transition:border-color .15s, box-shadow .15s}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,120,47,.14)}
  .field .hint{font-size:11.5px; color:var(--muted-2); margin-top:5px}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-weight:600; font-size:14px; transition:transform .05s, background .15s, border-color .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink); color:#f6f1e7}
  .btn-primary:hover{background:#000}
  .btn-gold{background:var(--gold); color:#fff}
  .btn-gold:hover{background:#986a26}
  .btn-ghost{background:transparent; color:var(--charcoal); border-color:var(--line-2)}
  .btn-ghost:hover{border-color:var(--muted); background:#faf7f1}
  .btn-danger{background:var(--neg-soft); color:var(--neg); border-color:#ecccc8}
  .btn-danger:hover{background:#f2d9d6}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px; font-size:13px}
  .btn-icon{padding:7px 9px; font-size:13px; background:#faf7f1; border:1px solid var(--line-2); border-radius:8px; color:var(--charcoal)}
  .btn-icon:hover{border-color:var(--muted)}

  /* ---------- app shell ---------- */
  #app{display:none; min-height:100%}
  .shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
  .side{background:var(--ink); color:#e9e1d2; padding:26px 18px; display:flex; flex-direction:column; gap:26px}
  .side .brand .name{color:#f6f1e7}
  .side .brand .tag{color:#b8ab93}
  .nav{display:flex; flex-direction:column; gap:4px}
  .nav button{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:transparent; border:none; color:#cdc3af; padding:11px 13px; border-radius:10px;
    font-size:14.5px; font-weight:500; letter-spacing:.01em}
  .nav button .ic{width:20px; text-align:center; font-size:16px; opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.05); color:#f2ead9}
  .nav button.on{background:linear-gradient(90deg, rgba(169,120,47,.22), rgba(169,120,47,.06));
    color:#fff; box-shadow:inset 3px 0 0 var(--gold-2)}
  .side .foot{margin-top:auto; font-size:11.5px; color:#8f836c; display:flex; flex-direction:column; gap:10px}
  .side .foot button{background:none; border:none; color:#b8ab93; text-align:left; padding:0; font-size:12px}
  .side .foot button:hover{color:#e9e1d2; text-decoration:underline}

  .main{padding:30px 34px 60px; overflow-x:hidden}
  .view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
  .view-head h2{font-family:var(--sans); font-weight:900; font-size:26px; margin:0; letter-spacing:.01em; text-transform:uppercase}
  .view-head .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:3px}

  /* ---------- cards / grid ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px}
  .stat{padding:18px 18px 16px; position:relative; overflow:hidden}
  .stat::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .stat .k{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .stat .v{font-family:var(--serif); font-weight:600; font-size:30px; margin-top:6px; line-height:1}
  .stat .m{font-size:12px; color:var(--muted); margin-top:6px}
  .stat.green .v{color:var(--pos)} .stat.green::before{background:linear-gradient(90deg,var(--pos),#57a97c)}

  /* ===================== DASHBOARD (dark jewel showpiece) ===================== */
  .dash{
    background:
      radial-gradient(120% 80% at 12% -10%, rgba(125,123,255,.18) 0%, transparent 42%),
      radial-gradient(110% 80% at 100% 0%, rgba(255,92,155,.16) 0%, transparent 45%),
      linear-gradient(160deg, var(--d-bg2) 0%, var(--d-bg) 60%);
    color:var(--d-ink); border-radius:24px; padding:30px 30px 26px;
    box-shadow:0 30px 70px -30px rgba(10,6,20,.8); position:relative; overflow:hidden;
  }
  .dash::after{content:""; position:absolute; inset:0; border-radius:24px; border:1px solid var(--d-line); pointer-events:none}
  .dash-top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; position:relative; z-index:1}
  .dash-eyebrow{font-family:var(--sans); font-weight:900; letter-spacing:.28em; font-size:11px;
    color:var(--gold-2); text-transform:uppercase; margin-bottom:8px}
  .dash-title{font-family:var(--sans); font-weight:900; font-size:34px; line-height:1.02; letter-spacing:-.01em; margin:0}
  .dash-date{color:var(--d-muted); font-size:13px; margin-top:7px; font-weight:400}
  .dash-new{background:linear-gradient(135deg,var(--j-gold1),var(--j-gold2)); color:#2a1500; border:none;
    font-weight:900; font-size:14px; letter-spacing:.01em; padding:12px 20px; border-radius:12px;
    box-shadow:0 10px 24px -8px rgba(224,89,43,.6)}
  .dash-new:active{transform:translateY(1px)}

  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px; position:relative; z-index:1}
  .tile{border-radius:18px; padding:20px 18px; color:#fff; position:relative; overflow:hidden;
    box-shadow:0 16px 34px -18px rgba(0,0,0,.7); opacity:0; transform:translateY(14px)}
  .tile.in{animation:tileIn .55s cubic-bezier(.2,.7,.2,1) forwards}
  .tile .tk{font-size:12.5px; font-weight:700; letter-spacing:.01em; opacity:.92}
  .tile .tv{font-weight:900; font-size:33px; line-height:1.05; margin-top:10px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .tile .tm{font-size:11.5px; margin-top:8px; opacity:.8; font-weight:400}
  .tile .glyph{position:absolute; right:-6px; top:-10px; font-size:78px; opacity:.16; line-height:1}
  .tile.emerald{background:linear-gradient(150deg,var(--j-emerald1),var(--j-emerald2))}
  .tile.gold{background:linear-gradient(150deg,var(--j-gold1),var(--j-gold2))}
  .tile.magenta{background:linear-gradient(150deg,var(--j-magenta1),var(--j-magenta2))}
  .tile.indigo{background:linear-gradient(150deg,var(--j-indigo1),var(--j-indigo2))}
  @keyframes tileIn{to{opacity:1; transform:none}}

  .dash .d-row{display:grid; grid-template-columns:1.6fr 1fr; gap:16px; align-items:start; position:relative; z-index:1}
  .d-card{background:rgba(255,255,255,.045); border:1px solid var(--d-line); border-radius:16px; padding:18px 20px}
  .d-card h3{font-family:var(--sans); font-weight:900; font-size:14px; letter-spacing:.03em; margin:0 0 14px; text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between; color:var(--d-ink)}
  .d-card h3 .yr{font-weight:700; font-size:12px; color:var(--d-muted)}
  .dash .low-chip{display:inline-block; margin:0 6px 6px 0; padding:5px 11px; border-radius:999px; font-size:12px;
    font-weight:700; background:linear-gradient(135deg,rgba(255,92,155,.22),rgba(177,42,143,.22));
    border:1px solid rgba(255,92,155,.4); color:#ffd6e6}
  .dash .low-ok{color:var(--d-muted); font-size:13px}
  .dash table{width:100%; border-collapse:collapse}
  .dash th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--d-muted);
    font-weight:700; text-align:left; padding:9px 12px; border-bottom:1px solid var(--d-line)}
  .dash td{padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.05); font-size:13.5px; color:#e9e3f5}
  .dash td.num{text-align:right} .dash th.num{text-align:right}
  .dash .pos{color:#3ee0a0; font-weight:700}
  .dash .empty{color:var(--d-muted); text-align:center; padding:22px}
  @media (prefers-reduced-motion:reduce){ .tile{opacity:1; transform:none; animation:none} }

  .row2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{padding:18px 20px}
  .panel h3{font-family:var(--sans); font-weight:900; font-size:16px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; text-transform:uppercase; letter-spacing:.02em}
  .panel h3 .count{font-family:var(--sans); font-size:11px; color:var(--muted); font-weight:600}

  /* ---------- table ---------- */
  table{width:100%; border-collapse:collapse}
  th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line)}
  td{padding:11px 12px; border-bottom:1px solid #f0ebe0; font-size:14px; vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#faf7f1}
  td.num, th.num{text-align:right}
  .lowstock td{background:var(--neg-soft)}
  .lowstock:hover td{background:#f4ddda}

  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:.02em}
  .pill.pos{background:var(--pos-soft); color:var(--pos)}
  .pill.warn{background:var(--neg-soft); color:var(--neg)}
  .pill.brand{background:var(--gold-soft); color:#8a6220}
  .money.pos{color:var(--pos); font-weight:600}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center}
  .search{flex:1; min-width:200px; position:relative}
  .search input{width:100%; padding:10px 12px 10px 36px; border:1px solid var(--line-2); border-radius:var(--radius-sm); background:var(--card)}
  .search input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,120,47,.14)}
  .search .mag{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted-2)}

  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-family:var(--serif); font-size:20px; color:var(--charcoal); margin-bottom:6px}

  /* ---------- POS ---------- */
  .pos{display:grid; grid-template-columns:1fr 380px; gap:16px; align-items:start}
  .pos-products{padding:16px 18px; max-height:72vh; overflow:auto}
  .plist{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .pitem{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:#fdfcf9}
  .pitem:hover{border-color:var(--gold-2); background:#fffdf8}
  .pitem .pn{font-weight:600}
  .pitem .pd{font-size:12px; color:var(--muted)}
  .pitem .pr{margin-left:auto; text-align:right}
  .pitem .add{color:var(--gold); font-weight:700; font-size:20px; line-height:1}
  .stock-tag{font-size:11px; color:var(--muted)}
  .stock-tag.low{color:var(--neg); font-weight:600}

  .cart{padding:16px 18px; position:sticky; top:20px}
  .cart h3{font-family:var(--serif); font-weight:600; font-size:19px; margin:0 0 12px}
  .cart-lines{display:flex; flex-direction:column; gap:8px; margin-bottom:12px; max-height:34vh; overflow:auto}
  .cl{display:grid; grid-template-columns:1fr auto; gap:4px 8px; padding:9px 0; border-bottom:1px solid #f0ebe0}
  .cl .nm{font-weight:600; font-size:13.5px}
  .cl .lt{text-align:right; font-weight:600}
  .qty{display:inline-flex; align-items:center; gap:0; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
  .qty button{width:26px; height:26px; border:none; background:#f5f0e7; color:var(--charcoal); font-size:15px}
  .qty button:hover{background:var(--gold-soft)}
  .qty span{min-width:30px; text-align:center; font-weight:600; font-size:13px}
  .cl .rm{background:none; border:none; color:var(--muted-2); font-size:15px; padding:0 4px}
  .cl .rm:hover{color:var(--neg)}
  .totline{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; color:var(--charcoal)}
  .totline.grand{border-top:1px solid var(--line-2); margin-top:6px; padding-top:10px; font-size:16px; font-weight:700}
  .totline.grand .v{font-family:var(--serif); font-size:22px}
  .cart .mini{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  .cart .mini input, .cart select, .cart .fullsel{width:100%; padding:9px 10px; border:1px solid var(--line-2); border-radius:8px; background:#fdfcf9}
  .cart label.mini-l{font-size:11px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px}

  /* ---------- modal ---------- */
  .backdrop{position:fixed; inset:0; background:rgba(27,22,16,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .backdrop.on{display:flex}
  .modal{background:var(--card); border-radius:var(--radius); box-shadow:0 24px 60px rgba(0,0,0,.28); width:100%; max-width:520px; max-height:88vh; overflow:auto}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line)}
  .modal-head h3{font-family:var(--serif); font-weight:600; font-size:21px; margin:0}
  .modal-head .x{background:none; border:none; font-size:22px; color:var(--muted); line-height:1}
  .modal-body{padding:20px 22px}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}

  /* ---------- toast ---------- */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#f6f1e7; padding:12px 20px; border-radius:10px; font-size:14px;
    opacity:0; transition:all .25s; z-index:80; box-shadow:0 12px 30px rgba(0,0,0,.3); max-width:90vw}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--neg)}
  #toast.ok{background:var(--pos)}

  .loading{padding:60px; text-align:center; color:var(--muted)}
  .spin{width:26px; height:26px; border:3px solid var(--line-2); border-top-color:var(--gold); border-radius:50%; margin:0 auto 12px; animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- invoice (print) ---------- */
  .inv{padding:6px 4px; color:#1b1610}
  .inv .ih{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:14px}
  .inv .ih .shop{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:.1em}
  .inv .ih .meta{text-align:right; font-size:12px; color:var(--charcoal)}
  .inv .who{display:flex; justify-content:space-between; font-size:13px; margin-bottom:14px}
  .inv table{margin-bottom:12px}
  .inv .tot{margin-left:auto; width:60%; max-width:260px}
  .inv .note{font-size:12px; color:var(--muted); margin-top:14px; border-top:1px dashed var(--line-2); padding-top:10px}

  /* ---------- mobile ---------- */
  .mtopbar{display:none}
  .mbottom{display:none}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .side{display:none}
    .mtopbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
      background:var(--ink); color:#f6f1e7; position:sticky; top:0; z-index:30}
    .mtopbar .name{font-family:var(--serif); font-weight:700; letter-spacing:.12em; font-size:19px}
    .mtopbar button{background:none; border:none; color:#cdc3af; font-size:12px}
    .main{padding:18px 16px 96px}
    .stat-grid{grid-template-columns:1fr 1fr; gap:12px}
    .tiles{grid-template-columns:1fr 1fr; gap:12px}
    .dash{padding:22px 18px}
    .dash-title{font-size:26px}
    .dash .d-row{grid-template-columns:1fr}
    .row2{grid-template-columns:1fr}
    .pos{grid-template-columns:1fr}
    .cart{position:static}
    .mbottom{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;
      background:var(--card); border-top:1px solid var(--line); padding:6px 4px 8px;
      box-shadow:0 -6px 18px rgba(27,22,16,.07)}
    .mbottom button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:600; padding:6px 0}
    .mbottom button .ic{font-size:19px}
    .mbottom button.on{color:var(--gold)}
    .view-head h2{font-size:24px}
    .grid2{grid-template-columns:1fr}
    .table-wrap{overflow-x:auto}
  }

  @media print{
    body{background:#fff}
    #app,#setup,.mtopbar,.mbottom,#toast{display:none !important}
    #printroot{display:block !important; padding:24px}
  }
  #printroot{display:none}
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <div class="mtopbar">
    <span class="name">OMME'S GALLERY</span>
    <button data-nav="settings">Settings</button>
  </div>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="name">OMME'S</span><span class="sub">GALLERY</span>
        <span class="tag">Buy your happiness</span>
      </div>
      <nav class="nav">

<script>
/* ===================== shop config (local, invoice display only) ===================== */
const CFG_KEY = 'omme_cfg_v1';
function getCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY) || 'null') || {}; }catch(e){ return {}; } }
function setCfg(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

const state = { products:[], customers:[], cart:[], customerId:'', view:'dashboard', chart:null };

/* ===================== ui helpers ===================== */
const $ = s => document.querySelector(s);
const tk = n => '\u09f3' + (Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(iso){ const d=new Date(iso); if(isNaN(d)) return esc(iso||''); return d.getDate()+' '+MONTHS[d.getMonth()]+', '+d.getFullYear(); }

let toastT;
function toast(msg, type){
  const t=$('#toast'); t.textContent=msg; t.className='show '+(type||'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2600);
}

/* ===================== OMME'S GALLERY — Local data core (Vol 6) =====================
   Ported from the Google Apps Script backend. Runs entirely in the browser against an
   in-memory DB persisted to IndexedDB. Exposes the same api(action, payload) the UI uses. */

const TABLES = ['Products','Customers','Sales','SaleItems','Suppliers','Expenses',
  'Purchases','PurchaseItems','Returns','ReturnItems','Dues','Lots'];
const KEY = {
  Products:'ID', Customers:'ID', Sales:'InvoiceNo', SaleItems:'InvoiceNo',
  Suppliers:'ID', Expenses:'ID', Purchases:'PurchaseNo', PurchaseItems:'PurchaseNo',
  Returns:'ReturnNo', ReturnItems:'ReturnNo', Dues:'ID', Lots:'ID'
};
const LOW_STOCK = 1;
const NUM_FIELDS = ['BuyPrice','SalePrice','Stock','Amount'];

let DB = null;

function emptyDB(){ const o = { _seq:{} }; TABLES.forEach(function(t){ o[t]=[]; }); return o; }
function ensureDB(){ if(!DB) DB=emptyDB(); if(!DB._seq) DB._seq={}; TABLES.forEach(function(t){ if(!Array.isArray(DB[t])) DB[t]=[]; }); }

function num(v){ return Number(v) || 0; }
function pad3(n){ return ('000'+n).slice(-3); }
function p2(n){ return ('0'+n).slice(-2); }
function ymd(d){ d=d||new Date(); return String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate()); }
function dstr(v){ const d=new Date(v); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function ym(v){ const d=new Date(v); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function yy(v){ return String(new Date(v).getFullYear()); }
function nextNo(table, prefix){ const n = (DB._seq[table] = (DB._seq[table]||0) + 1); return prefix + ymd() + '-' + pad3(n); }
function newId(prefix){ return prefix + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*46656).toString(36); }

function readAll(name){ return DB[name].map(function(r){ return Object.assign({}, r); }); }
function coerce(item){ NUM_FIELDS.forEach(function(f){ if(item[f]!==undefined && item[f]!=='') item[f]=Number(item[f])||0; }); return item; }
function rowIndex(name, id){ const k=KEY[name]; return DB[name].findIndex(function(r){ return String(r[k])===String(id); }); }
function findProduct(id){ return DB.Products.find(function(p){ return String(p.ID)===String(id); }); }

/* ---------- CRUD ---------- */
function saveRow(name, item, prefix){
  coerce(item);
  const k = KEY[name];
  let id = item[k];
  const arr = DB[name];
  let isNew=false;
  if(!id){ id = newId(prefix); item[k]=id; item.CreatedAt = new Date().toISOString(); }
  const i = arr.findIndex(function(r){ return String(r[k])===String(id); });
  if(i>-1){ const ex=arr[i]; const merged=Object.assign({}, ex, item); if(ex.CreatedAt) merged.CreatedAt=ex.CreatedAt; arr[i]=merged; }
  else { if(!item.CreatedAt) item.CreatedAt=new Date().toISOString(); arr.push(Object.assign({}, item)); isNew=true; }
  return { id:id, isNew:isNew };
}
function deleteRow(name, id){ const i=rowIndex(name,id); if(i>-1) DB[name].splice(i,1); return { deleted:i>-1 }; }

/* ---------- FIFO lot costing ----------
   Every time stock enters (new product, Purchase, Return) a Lot row is recorded
   with its own BuyPrice and remaining Qty. Every sale consumes the OLDEST lots
   first, so profit reflects what that specific unit actually cost — even if the
   product's displayed BuyPrice has since gone up from a later restock. */
function consumeLotsFIFO(productId, qty, fallbackBuyPrice){
  let remaining=num(qty), costSum=0;
  const lots=DB.Lots.filter(function(l){ return String(l.ProductID)===String(productId) && num(l.Qty)>0; })
    .sort(function(a,b){ return new Date(a.Date)-new Date(b.Date); });
  for(let i=0;i<lots.length && remaining>0;i++){
    const l=lots[i]; const take=Math.min(num(l.Qty), remaining);
    if(take<=0) continue;
    costSum += take*num(l.BuyPrice); l.Qty=num(l.Qty)-take; remaining-=take;
  }
  if(remaining>0){ costSum += remaining*num(fallbackBuyPrice); remaining=0; }
  return num(qty)>0 ? costSum/num(qty) : 0;
}
function addLot(productId, buyPrice, qty, purchaseNo){
  if(!productId || num(qty)<=0) return;
  DB.Lots.push({ ID:newId('LOT'), ProductID:productId, BuyPrice:num(buyPrice), Qty:num(qty),
    Date:new Date().toISOString(), PurchaseNo:purchaseNo||'' });
}

/* ---------- Sales ---------- */
function L_createSale(sale, items){
  items = items || [];
  const invNo = nextNo('Sales','OG');
  const now = new Date();
  let subtotal=0, profit=0;
  items.forEach(function(it){
    const qty=num(it.Qty), sp=num(it.SalePrice);
    const p=findProduct(it.ProductID);
    const fallback=p?num(p.BuyPrice):num(it.BuyPrice);
    const bp = it.ProductID ? consumeLotsFIFO(it.ProductID, qty, fallback) : num(it.BuyPrice);
    it.BuyPrice = Math.round(bp*100)/100;
    it.LineTotal=qty*sp; it.LineProfit=qty*(sp-it.BuyPrice);
    subtotal+=it.LineTotal; profit+=it.LineProfit;
    if(p) p.Stock = num(p.Stock) - qty;
  });
  const discount=num(sale.Discount), delivery=num(sale.Delivery);
  const total=subtotal-discount+delivery;
  const netProfit=profit-discount;
  DB.Sales.push({ InvoiceNo:invNo, Date:now.toISOString(), CustomerID:sale.CustomerID||'', CustomerName:sale.CustomerName||'',
    Subtotal:subtotal, Discount:discount, Delivery:delivery, Total:total, Profit:netProfit,
    Payment:sale.Payment||'Cash', Status:sale.Status||'Delivered', Note:sale.Note||'' });
  items.forEach(function(it){
    DB.SaleItems.push({ InvoiceNo:invNo, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
      Qty:num(it.Qty), SalePrice:num(it.SalePrice), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal, LineProfit:it.LineProfit });
  });
  const received = (sale.Paid===''||sale.Paid==null) ? total : num(sale.Paid);
  let due=0;
  if(received<total){
    due=total-received;
    DB.Dues.push({ ID:newId('D'), Date:now.toISOString(), InvoiceNo:invNo, CustomerID:sale.CustomerID||'',
      CustomerName:sale.CustomerName||'', Amount:due, Paid:0, Balance:due, Status:'Due', Note:'' });
  }
  return { invoiceNo:invNo, subtotal:subtotal, discount:discount, delivery:delivery, total:total, profit:netProfit, received:received, due:due };
}
function L_listSales(){ return readAll('Sales').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_getSale(no){
  return { sale: DB.Sales.filter(function(s){ return String(s.InvoiceNo)===String(no); }).map(function(r){return Object.assign({},r);})[0]||null,
           items: DB.SaleItems.filter(function(i){ return String(i.InvoiceNo)===String(no); }).map(function(r){return Object.assign({},r);}) };
}
function L_customerHistory(id){
  const sales = readAll('Sales').filter(function(s){ return String(s.CustomerID)===String(id); })
    .sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); });
  let spent=0, prof=0; sales.forEach(function(s){ spent+=num(s.Total); prof+=num(s.Profit); });
  let due=0; DB.Dues.forEach(function(d){ if(String(d.CustomerID)===String(id)) due+=num(d.Balance); });
  return { sales:sales, orders:sales.length, totalSpent:spent, totalProfit:prof, due:due };
}

/* ---------- Dashboard ---------- */
function L_dashboard(){
  const sales=DB.Sales, products=DB.Products, returns=DB.Returns, dues=DB.Dues;
  const todayStr=dstr(new Date()), yr=String(new Date().getFullYear());
  let tSales=0,tProfit=0,tOrders=0,allSales=0,allProfit=0; const monthly={};
  sales.forEach(function(s){
    const total=num(s.Total), pf=num(s.Profit);
    allSales+=total; allProfit+=pf;
    if(dstr(s.Date)===todayStr){ tSales+=total; tProfit+=pf; tOrders++; }
    if(yy(s.Date)===yr){ const m=ym(s.Date); monthly[m]=(monthly[m]||0)+total; }
  });
  let tRet=0,tRetProfit=0,allRet=0,allRetProfit=0;
  returns.forEach(function(r){
    const amt=num(r.Amount), rp=num(r.ProfitReversed);
    allRet+=amt; allRetProfit+=rp;
    if(dstr(r.Date)===todayStr){ tRet+=amt; tRetProfit+=rp; }
    if(yy(r.Date)===yr){ const m=ym(r.Date); monthly[m]=(monthly[m]||0)-amt; }
  });
  let outstandingDue=0; dues.forEach(function(x){ outstandingDue+=num(x.Balance); });
  const totalStock=products.reduce(function(s,p){ return s+num(p.Stock); },0);
  const recent=readAll('Sales').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }).slice(0,8);
  const low=readAll('Products').filter(function(p){ return num(p.Stock)<=LOW_STOCK; });
  return {
    today:{ sales:tSales-tRet, profit:tProfit-tRetProfit, orders:tOrders, returns:tRet },
    allTime:{ sales:allSales-allRet, profit:allProfit-allRetProfit, orders:sales.length, returns:allRet },
    outstandingDue:outstandingDue, totalStock:totalStock, year:yr, monthly:monthly, recent:recent,
    lowStock:low, productCount:products.length, customerCount:DB.Customers.length
  };
}

/* ---------- Report ---------- */
function L_report(from, to){
  const sales=DB.Sales, items=DB.SaleItems, products=DB.Products;
  const brandOf={}; products.forEach(function(p){ brandOf[p.ID]=p.Brand||'—'; });
  function inRange(v){ const ds=dstr(v); if(from && ds<from) return false; if(to && ds>to) return false; return true; }
  const S=sales.filter(function(s){ return s.Date && inRange(s.Date); });
  const invSet={}; S.forEach(function(s){ invSet[s.InvoiceNo]=true; });
  const I=items.filter(function(it){ return invSet[it.InvoiceNo]; });
  let totalSales=0,totalProfit=0,totalDiscount=0,totalDelivery=0,subtotal=0;
  S.forEach(function(s){ totalSales+=num(s.Total); totalProfit+=num(s.Profit); totalDiscount+=num(s.Discount); totalDelivery+=num(s.Delivery); subtotal+=num(s.Subtotal); });
  let itemsSold=0,cogs=0; I.forEach(function(it){ itemsSold+=num(it.Qty); cogs+=num(it.Qty)*num(it.BuyPrice); });
  const orders=S.length;
  const retRows=DB.Returns.filter(function(r){ return r.Date && inRange(r.Date); });
  let retAmount=0,retProfit=0; retRows.forEach(function(r){ retAmount+=num(r.Amount); retProfit+=num(r.ProfitReversed); });
  const netSales=totalSales-retAmount, netProfit=totalProfit-retProfit;
  const pAgg={}; I.forEach(function(it){ const k=it.ProductID||it.ProductName;
    if(!pAgg[k]) pAgg[k]={name:it.ProductName, brand:brandOf[it.ProductID]||'—', qty:0, revenue:0, profit:0};
    pAgg[k].qty+=num(it.Qty); pAgg[k].revenue+=num(it.LineTotal); pAgg[k].profit+=num(it.LineProfit); });
  const bestSellers=Object.keys(pAgg).map(function(k){return pAgg[k];}).sort(function(a,b){return b.qty-a.qty;});
  const bAgg={}; I.forEach(function(it){ const b=brandOf[it.ProductID]||'—';
    if(!bAgg[b]) bAgg[b]={brand:b, qty:0, revenue:0, profit:0};
    bAgg[b].qty+=num(it.Qty); bAgg[b].revenue+=num(it.LineTotal); bAgg[b].profit+=num(it.LineProfit); });
  const byBrand=Object.keys(bAgg).map(function(k){return bAgg[k];}).sort(function(a,b){return b.revenue-a.revenue;});
  const cAgg={}; S.forEach(function(s){ const k=s.CustomerName||'Walk-in';
    if(!cAgg[k]) cAgg[k]={name:k, orders:0, spent:0, profit:0};
    cAgg[k].orders++; cAgg[k].spent+=num(s.Total); cAgg[k].profit+=num(s.Profit); });
  const byCustomer=Object.keys(cAgg).map(function(k){return cAgg[k];}).sort(function(a,b){return b.spent-a.spent;});
  const pay={}; S.forEach(function(s){ const k=s.Payment||'Cash'; pay[k]=(pay[k]||0)+num(s.Total); });
  const thisYear=new Date().getFullYear();
  const cur=[],prev=[],prof=[]; for(let i=0;i<12;i++){ cur.push(0); prev.push(0); prof.push(0); }
  sales.forEach(function(s){ if(!s.Date) return; const y=new Date(s.Date).getFullYear(), m=new Date(s.Date).getMonth();
    if(y===thisYear){ cur[m]+=num(s.Total); prof[m]+=num(s.Profit); } else if(y===thisYear-1){ prev[m]+=num(s.Total); } });
  DB.Returns.forEach(function(r){ if(!r.Date) return; const y=new Date(r.Date).getFullYear(), m=new Date(r.Date).getMonth();
    if(y===thisYear){ cur[m]-=num(r.Amount); prof[m]-=num(r.ProfitReversed); } else if(y===thisYear-1){ prev[m]-=num(r.Amount); } });
  return {
    range:{from:from||null,to:to||null},
    summary:{ totalSales:netSales, totalProfit:netProfit, grossSales:totalSales, returns:retAmount, retProfit:retProfit,
      orders:orders, itemsSold:itemsSold, totalDiscount:totalDiscount, totalDelivery:totalDelivery, cogs:cogs, subtotal:subtotal,
      avgOrder:orders?netSales/orders:0, avgProfit:orders?netProfit/orders:0, margin:netSales?(netProfit/netSales*100):0 },
    bestSellers:bestSellers, byBrand:byBrand, byCustomer:byCustomer, byPayment:pay,
    yoy:{ year:thisYear, cur:cur, prev:prev, profit:prof }
  };
}

/* ---------- Purchases ---------- */
function L_createPurchase(pur, items){
  items=items||[]; const no=nextNo('Purchases','PO'); const now=new Date(); let total=0;
  items.forEach(function(it){ const qty=num(it.Qty), bp=num(it.BuyPrice); it.LineTotal=qty*bp; total+=it.LineTotal;
    const p=findProduct(it.ProductID); if(p){ p.Stock=num(p.Stock)+qty; if(bp>0) p.BuyPrice=bp; }
    addLot(it.ProductID, bp, qty, no); });
  const paid=num(pur.Paid), due=total-paid;
  DB.Purchases.push({ PurchaseNo:no, Date:now.toISOString(), SupplierID:pur.SupplierID||'', SupplierName:pur.SupplierName||'',
    Total:total, Paid:paid, Due:due, Status:(due<=0?'Paid':'Due'), Note:pur.Note||'' });
  items.forEach(function(it){ DB.PurchaseItems.push({ PurchaseNo:no, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
    Qty:num(it.Qty), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal }); });
  return { purchaseNo:no, total:total, paid:paid, due:due };
}
function L_listPurchases(){ return readAll('Purchases').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_getPurchase(no){
  return { purchase: DB.Purchases.filter(function(x){return String(x.PurchaseNo)===String(no);}).map(function(r){return Object.assign({},r);})[0]||null,
           items: DB.PurchaseItems.filter(function(i){return String(i.PurchaseNo)===String(no);}).map(function(r){return Object.assign({},r);}) };
}
function L_updatePurchasePayment(no, paid){
  const i=rowIndex('Purchases',no); if(i<0) return {error:'not found'};
  const row=DB.Purchases[i]; const total=num(row.Total), p=num(paid), due=total-p;
  row.Paid=p; row.Due=due; row.Status=(due<=0?'Paid':'Due'); return { paid:p, due:due };
}

/* ---------- Returns & Dues ---------- */
function L_createReturn(ret, items){
  items=items||[]; const no=nextNo('Returns','RT'); const now=new Date(); let amount=0, profitRev=0;
  items.forEach(function(it){ const qty=num(it.Qty), sp=num(it.SalePrice), bp=num(it.BuyPrice);
    it.LineTotal=qty*sp; it.LineProfit=qty*(sp-bp); amount+=it.LineTotal; profitRev+=it.LineProfit;
    const p=findProduct(it.ProductID); if(p) p.Stock=num(p.Stock)+qty;
    addLot(it.ProductID, bp, qty, ''); });
  DB.Returns.push({ ReturnNo:no, Date:now.toISOString(), InvoiceNo:ret.InvoiceNo||'', CustomerName:ret.CustomerName||'',
    Amount:amount, ProfitReversed:profitRev, Note:ret.Note||'' });
  items.forEach(function(it){ DB.ReturnItems.push({ ReturnNo:no, ProductID:it.ProductID||'', ProductName:it.ProductName||'',
    Qty:num(it.Qty), SalePrice:num(it.SalePrice), BuyPrice:num(it.BuyPrice), LineTotal:it.LineTotal, LineProfit:it.LineProfit }); });
  return { returnNo:no, amount:amount, profitReversed:profitRev };
}
function L_listReturns(){ return readAll('Returns').sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_listDues(){ return readAll('Dues').filter(function(d){ return num(d.Balance)>0; }).sort(function(a,b){ return new Date(b.Date)-new Date(a.Date); }); }
function L_payDue(id, amount){
  const i=rowIndex('Dues',id); if(i<0) return {error:'not found'};
  const row=DB.Dues[i]; const amt=num(row.Amount); const paidNow=num(row.Paid)+num(amount); const bal=amt-paidNow;
  row.Paid=paidNow; row.Balance=bal; row.Status=(bal<=0?'Paid':'Due'); return { paid:paidNow, balance:bal };
}

/* ---------- dispatcher (same interface the UI already uses) ---------- */
const MUTATIONS = ['saveProduct','deleteProduct','saveCustomer','deleteCustomer','createSale','saveSupplier',
  'deleteSupplier','saveExpense','deleteExpense','createPurchase','updatePurchasePayment','createReturn','payDue'];

async function api(action, p){
  p = p || {}; ensureDB(); let out;
  switch(action){
    case 'dashboard':       out=L_dashboard(); break;
    case 'listProducts':    out=readAll('Products'); break;
    case 'saveProduct': {
      const r=saveRow('Products', p.item, 'P');
      if(r.isNew) addLot(r.id, p.item.BuyPrice, p.item.Stock, '');
      out=r; break;
    }
    case 'productLots':     out=readAll('Lots').filter(function(l){ return String(l.ProductID)===String(p.id) && num(l.Qty)>0; })
                               .sort(function(a,b){ return new Date(a.Date)-new Date(b.Date); }); break;
    case 'deleteProduct':   out=deleteRow('Products', p.id); break;
    case 'listCustomers':   out=readAll('Customers'); break;
    case 'saveCustomer':    out=saveRow('Customers', p.item, 'C'); break;
    case 'deleteCustomer':  out=deleteRow('Customers', p.id); break;
    case 'customerHistory': out=L_customerHistory(p.id); break;
    case 'listSales':       out=L_listSales(); break;
    case 'getSale':         out=L_getSale(p.invoiceNo); break;
    case 'createSale':      out=L_createSale(p.sale, p.items); break;
    case 'report':          out=L_report(p.from, p.to); break;
    case 'listSuppliers':   out=readAll('Suppliers'); break;
    case 'saveSupplier':    out=saveRow('Suppliers', p.item, 'S'); break;
    case 'deleteSupplier':  out=deleteRow('Suppliers', p.id); break;
    case 'listExpenses':    out=readAll('Expenses'); break;
    case 'saveExpense':     out=saveRow('Expenses', p.item, 'E'); break;
    case 'deleteExpense':   out=deleteRow('Expenses', p.id); break;
    case 'listPurchases':   out=L_listPurchases(); break;
    case 'getPurchase':     out=L_getPurchase(p.purchaseNo); break;
    case 'createPurchase':  out=L_createPurchase(p.purchase, p.items); break;
    case 'updatePurchasePayment': out=L_updatePurchasePayment(p.purchaseNo, p.paid); break;
    case 'createReturn':    out=L_createReturn(p.ret, p.items); break;
    case 'listReturns':     out=L_listReturns(); break;
    case 'listDues':        out=L_listDues(); break;
    case 'payDue':          out=L_payDue(p.id, p.amount); break;
    default: throw new Error('Unknown action: '+action);
  }
  if(MUTATIONS.indexOf(action)>-1) await persist();
  return out;
}

/* ---------- persistence (IndexedDB single blob) ---------- */
const IDB_NAME='ommes_local_v1', IDB_STORE='kv', IDB_KEY='db';
function idbOpen(){ return new Promise(function(res,rej){ const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
  r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
async function idbGet(){ const db=await idbOpen(); return new Promise(function(res,rej){
  const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(IDB_KEY);
  t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ rej(t.error); }; }); }
async function idbSet(v){ const db=await idbOpen(); return new Promise(function(res,rej){
  const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,IDB_KEY);
  tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; }); }

let PERSIST_OK=true;
async function persist(){ if(!PERSIST_OK) return; try{ await idbSet(DB); }catch(e){ PERSIST_OK=false; } }
async function loadDB(){ try{ DB=await idbGet(); }catch(e){ DB=null; PERSIST_OK=false; } ensureDB(); }

/* ---------- backup ---------- */
function exportBackup(){ ensureDB(); return JSON.stringify(DB); }
function importBackup(json){
  const obj = (typeof json==='string') ? JSON.parse(json) : json;
  if(!obj || typeof obj!=='object') throw new Error('Invalid backup file');
  const ok = TABLES.some(function(t){ return Array.isArray(obj[t]); });
  if(!ok) throw new Error('This file does not look like an OMME backup');
  DB = obj; ensureDB(); return true;
}

function animateTiles(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.tile').forEach(function(t){ t.classList.add('in'); });
  document.querySelectorAll('.tile .tv').forEach(function(el){
    const to=Number(el.getAttribute('data-count'))||0;
    if(reduce || to===0){ el.textContent=tk(to); return; }
    const dur=750, t0=performance.now();
    function step(now){
      const p=Math.min((now-t0)/dur,1);
      const e=1-Math.pow(1-p,3); // easeOutCubic
      el.textContent=tk(Math.round(to*e));
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function drawChart(months){
  const el=document.getElementById('mchart'); if(!el||!window.Chart) return;
  if(state.chart){ state.chart.destroy(); }
  const ctx=el.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,180);
  grad.addColorStop(0,'#f9b233'); grad.addColorStop(1,'rgba(224,89,43,.55)');
  state.chart=new Chart(el,{
    type:'bar',
    data:{ labels:months.map(m=>m.label),
      datasets:[{ data:months.map(m=>m.val), backgroundColor:grad, hoverBackgroundColor:'#ffd27a', borderRadius:7, maxBarThickness:34 }]},
    options:{ animation:{duration:800}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>tk(c.raw)}}},
      scales:{ y:{ticks:{callback:v=>v>=1000?(v/1000)+'k':v, color:'#a99fc4'}, grid:{color:'rgba(255,255,255,.07)'}},
               x:{ticks:{color:'#a99fc4'}, grid:{display:false}} } }
  });
}

function renderCart(){
  const box=$('#cart-lines'); if(!box) return;
  if(!state.cart.length){ box.innerHTML='<div class="empty" style="padding:24px 0">Tap a product to add it.</div>'; }
  else{

  const recv=$('#s-received')?$('#s-received').value:'';

  const due = t.total - received;
  if(tbox) tbox.innerHTML=`
    <div class="totline"><span>Subtotal</span><span class="tnum">${tk(t.subtotal)}</span></div>

}
function addToCart(id){
  const p=state.products.find(x=>String(x.ID)===String(id)); if(!p) return;
  const ex=state.cart.find(i=>i.id===p.ID);
  const inCart=ex?ex.qty:0;
  const stock=Number(p.Stock)||0;
  if(inCart+1>stock){
    if(stock<=0){ if(!confirm('"'+p.Name+'" এখন sold out (stock 0)। তবুও বিক্রি করবে? (stock মাইনাস হয়ে যাবে)')) return; }
    else if(!confirm('"'+p.Name+'" এর stock মাত্র '+stock+'টা। তবুও যোগ করবে?')) return;
  }
  if(ex) ex.qty++;
  else state.cart.push({ id:p.ID, name:p.Name, sale:Number(p.SalePrice)||0, buy:Number(p.BuyPrice)||0, qty:1 });
  renderCart();
}
function cartQty(id, d){

  renderCart();
}

function repPresetRange(kind){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const f=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  if(kind==='month')     return {from:f(new Date(y,m,1)),   to:f(now),              preset:'month'};
  if(kind==='lastmonth') return {from:f(new Date(y,m-1,1)), to:f(new Date(y,m,0)),  preset:'lastmonth'};
  if(kind==='year')      return {from:f(new Date(y,0,1)),   to:f(now),              preset:'year'};
  return {from:'', to:'', preset:'all'};
}
const pct = n => (Math.round((Number(n)||0)*10)/10)+'%';

function downloadCSV(name, header, rows){
  const q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv=[header.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    d.byBrand.map(b=>[b.brand,b.qty,b.revenue,b.profit])); toast('Exported','ok'); }
async function exportSales(){
  try{
    const all=await api('listSales'); const r=state.repRange;
    const inR=s=>{ const ds=(new Date(s.Date)).toISOString().slice(0,10);
      if(r.from && ds<r.from) return false; if(r.to && ds>r.to) return false; return true; };
    const rows=all.filter(s=>s.Date&&inR(s)).map(s=>[s.InvoiceNo,(new Date(s.Date)).toISOString().slice(0,10),
      s.CustomerName,s.Subtotal,s.Discount,s.Delivery,s.Total,s.Profit,s.Payment,s.Status]);
    downloadCSV('sales.csv',['Invoice','Date','Customer','Subtotal','Discount','Delivery','Total','Profit','Payment','Status'],rows);
    toast('Exported '+rows.length+' sales','ok');
  }catch(e){ toast(e.message,'err'); }
}

/* ===================== EXPENSES ===================== */
const EXP_CATS=['Packaging','Facebook Marketing','Website','Delivery','Rent','Salary','Utilities','Other'];
async function viewExpenses(){
  loadingView('Loading expenses…');
  try{ state.expData=await api('listExpenses'); }catch(e){ if(e.message==='AUTH')return; }
  renderExpenses('', '');
}
function thisMonthKey(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function renderExpenses(q, cat){
  const list=(state.expData||[]).filter(e=>
    (!q || (String(e.Category)+e.Note).toLowerCase().includes(q.toLowerCase())) &&
    (!cat || e.Category===cat))
    .sort((a,b)=>new Date(b.Date)-new Date(a.Date));
  let totalAll=0, totalMonth=0; const byCat={}; const mk=thisMonthKey();
  (state.expData||[]).forEach(e=>{ const a=Number(e.Amount)||0; totalAll+=a;
    byCat[e.Category]=(byCat[e.Category]||0)+a;
    if(String(e.Date).slice(0,7)===mk) totalMonth+=a; });
  const catPills=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a])
    .map(k=>`<span class="pill brand" style="margin:0 6px 6px 0; display:inline-block">${esc(k)}: ${tk(byCat[k])}</span>`).join('')||'—';
  const opts=EXP_CATS.map(c=>`<option value="${c}" ${cat===c?'selected':''}>${c}</option>`).join('');
  const rows=list.map(e=>`<tr>
      <td class="tnum">${fdate(e.Date)}</td>
      <td><span class="pill brand">${esc(e.Category)}</span></td>
      <td>${esc(e.Note||'')}</td>
      <td class="num tnum">${tk(e.Amount)}</td>
      <td class="num"><button class="btn-icon" data-act="exp-edit" data-id="${esc(e.ID)}">Edit</button>
        <button class="btn-icon" data-act="exp-del" data-id="${esc(e.ID)}">✕</button></td>
    </tr>`).join('')||`<tr><td colspan="5" class="empty"><div class="big">No expenses yet</div>Log packaging, ad spend, rent etc.</td></tr>`;
  $('#view').innerHTML=`
    <div class="view-head"><div><div class="eyebrow">Expenses</div><h2>Expense ledger</h2></div>
      <button class="btn btn-gold" data-act="exp-new">＋ Add expense</button></div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr">
      <div class="card stat"><div class="k">This month</div><div class="v tnum">${tk(totalMonth)}</div></div>
      <div class="card stat"><div class="k">All time</div><div class="v tnum">${tk(totalAll)}</div></div>
    </div>
    <div class="card panel" style="margin-bottom:16px"><h3>By category</h3><div>${catPills}</div>
      <p style="font-size:12px;color:var(--muted);margin:10px 0 0">These are tracked separately. Since your Buy price already includes packaging/delivery/ad cost, they are <strong>not</strong> subtracted again from sales profit.</p></div>
    <div class="toolbar">
      <div class="search"><span class="mag">⌕</span><input id="exp-search" placeholder="Search note/category…" value="${esc(q)}"></div>
      <select id="exp-cat" style="padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--card)">
        <option value="">All categories</option>${opts}</select>
    </div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th><th class="num">Actions</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
  const s=$('#exp-search'); if(s){ s.oninput=()=>{ const v=s.value; renderExpenses(v, $('#exp-cat').value); const n=$('#exp-search'); if(n){n.focus(); n.value=v;} }; }
  const c=$('#exp-cat'); if(c) c.onchange=()=>renderExpenses($('#exp-search').value, c.value);
}
function expenseForm(x){
  x=x||{}; const today=new Date().toISOString().slice(0,10);
  openModal(`
    <div class="modal-head"><h3>${x.ID?'Edit expense':'Add expense'}</h3><button class="x" data-act="modal-close">×</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><label>Date</label><input id="x-date" type="date" value="${esc(x.Date?String(x.Date).slice(0,10):today)}"></div>
        <div class="field"><label>Amount (৳) *</label><input id="x-amt" type="number" value="${x.Amount||''}"></div>

      <div class="field"><label>Category</label><input id="x-cat" list="expcats" value="${esc(x.Category||'')}" placeholder="Packaging / Facebook Marketing…">
        <datalist id="expcats">${EXP_CATS.map(c=>'<option>'+c+'</option>').join('')}</datalist></div>
      <div class="field"><label>Note</label><input id="x-note" value="${esc(x.Note||'')}"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-act="modal-close">Cancel</button>
      <button class="btn btn-gold" data-act="exp-save" data-id="${esc(x.ID||'')}">Save</button></div>`);

async function saveExpense(id){
  const item={ ID:id||'', Date:$('#x-date').value, Amount:$('#x-amt').value,
    Category:$('#x-cat').value.trim()||'Other', Note:$('#x-note').value.trim() };
  if(!item.Amount || Number(item.Amount)<=0){ toast('Enter an amount','err'); return; }
  try{ await api('saveExpense',{item}); closeModal(); toast('Expense saved','ok'); viewExpenses(); }

async function viewPurchases(){
  if(!state.purTab) state.purTab='list';
  state.purCart=state.purCart||[];
  loadingView('Loading purchases…');
  try{
    const [pu,su,pr]=await Promise.all([api('listPurchases'),api('listSuppliers'),api('listProducts')]);
    state.purchases=pu||[]; state.suppliers=su||[]; state.products=pr||[];
  }catch(e){ if(e.message==='AUTH')return; }
  renderPurchases();
}
function purTabBar(){
  const t=state.purTab;
  const b=(k,l)=>`<button class="btn btn-sm ${t===k?'btn-gold':'btn-ghost'}" data-act="pur-tab" data-tab="${k}">${l}</button>`;
  return `<div class="toolbar">${b('list','Purchases')}${b('due','Due list')}${b('suppliers','Suppliers')}
    <span style="flex:1"></span>
    <button class="btn btn-gold btn-sm" data-act="pur-tab" data-tab="new">＋ New purchase</button></div>`;
}
function renderPurchases(){
  const t=state.purTab;
  if(t==='new') return renderNewPurchase();
  let body='';
  if(t==='suppliers'){
    const rows=(state.suppliers||[]).map(s=>`<tr>
        <td><strong>${esc(s.Name)}</strong></td><td>${esc(s.Company||'')}</td>
        <td class="tnum">${esc(s.Phone||'')}</td>
        <td class="num"><button class="btn-icon" data-act="sup-edit" data-id="${esc(s.ID)}">Edit</button>
          <button class="btn-icon" data-act="sup-del" data-id="${esc(s.ID)}">✕</button></td></tr>`).join('')
      ||`<tr><td colspan="4" class="empty"><div class="big">No suppliers yet</div>Add the shops/brands you buy from.</td></tr>`;
    body=`<div class="toolbar" style="margin-top:-6px"><span style="flex:1"></span>
        <button class="btn btn-gold btn-sm" data-act="sup-new">＋ Add supplier</button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Company</th><th>Phone</th><th class="num">Actions</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  } else if(t==='due'){
    const due=(state.purchases||[]).filter(p=>Number(p.Due)>0);
    let totalDue=0; due.forEach(p=>totalDue+=Number(p.Due)||0);
    const bySup={}; due.forEach(p=>{ const k=p.SupplierName||'—'; bySup[k]=(bySup[k]||0)+(Number(p.Due)||0); });
    const supPills=Object.keys(bySup).map(k=>`<span class="pill warn" style="margin:0 6px 6px 0;display:inline-block">${esc(k)}: ${tk(bySup[k])}</span>`).join('')||'—';
    const rows=due.map(p=>`<tr>
        <td>${esc(p.PurchaseNo)}</td><td>${fdate(p.Date)}</td><td>${esc(p.SupplierName||'—')}</td>
        <td class="num tnum">${tk(p.Total)}</td><td class="num tnum">${tk(p.Paid)}</td>
        <td class="num tnum money" style="color:var(--neg);font-weight:600">${tk(p.Due)}</td>
        <td class="num"><button class="btn-icon" data-act="pur-view" data-no="${esc(p.PurchaseNo)}">Pay</button></td></tr>`).join('')
      ||`<tr><td colspan="7" class="empty">No dues. All suppliers paid ✦</td></tr>`;
    body=`<div class="stat-grid" style="grid-template-columns:1fr"><div class="card stat"><div class="k">Total due to suppliers</div><div class="v tnum" style="color:var(--neg)">${tk(totalDue)}</div></div></div>
      <div class="card panel" style="margin-bottom:16px"><h3>By supplier</h3><div>${supPills}</div></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>PO</th><th>Date</th><th>Supplier</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Due</th><th class="num"></th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  } else {
    const rows=(state.purchases||[]).map(p=>`<tr>
        <td>${esc(p.PurchaseNo)}</td><td>${fdate(p.Date)}</td><td>${esc(p.SupplierName||'—')}</td>
        <td class="num tnum">${tk(p.Total)}</td><td class="num tnum">${tk(p.Paid)}</td>
        <td class="num tnum">${Number(p.Due)>0?'<span class="pill warn">'+tk(p.Due)+'</span>':'<span class="pill pos">Paid</span>'}</td>
        <td class="num"><button class="btn-icon" data-act="pur-view" data-no="${esc(p.PurchaseNo)}">View</button></td></tr>`).join('')
      ||`<tr><td colspan="7" class="empty"><div class="big">No purchases yet</div>Record stock you buy — it adds to inventory automatically.</td></tr>`;
    body=`<div class="card"><div class="table-wrap"><table>
        <thead><tr><th>PO</th><th>Date</th><th>Supplier</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Due</th><th class="num"></th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  }
  $('#view').innerHTML=`
    <div class="view-head"><div><div class="eyebrow">Stock inward</div><h2>Purchases &amp; suppliers</h2></div></div>
    ${purTabBar()}${body}`;
}
function purCartTotal(){ let t=0; state.purCart.forEach(i=>t+=i.qty*i.buy); return t; }
function renderNewPurchase(){
  const supOpts=(state.suppliers||[]).map(s=>`<option value="${esc(s.ID)}">${esc(s.Name)}${s.Company?' — '+esc(s.Company):''}</option>`).join('');
  $('#view').innerHTML=`
    <div class="view-head"><div><div class="eyebrow">Stock inward</div><h2>New purchase</h2></div>
      <button class="btn btn-ghost btn-sm" data-act="pur-tab" data-tab="list">← Back</button></div>
    <div class="pos">
      <div class="card pos-products">
        <div class="search"><span class="mag">⌕</span><input id="pur-search" placeholder="Search product to add…"></div>
        <div class="plist" id="pur-plist"></div>
      </div>
      <div class="card cart">
        <h3>Purchase</h3>
        <div><label class="mini-l">Supplier</label>
          <select class="fullsel" id="pur-sup"><option value="">— none —</option>${supOpts}</select>
          <button class="btn btn-ghost btn-sm" style="margin-top:8px" data-act="sup-new-inline">＋ New supplier</button></div>
        <div class="cart-lines" id="pur-lines" style="margin-top:12px"></div>
        <div style="margin-top:8px"><label class="mini-l">Amount paid now (৳)</label><input class="fullsel" id="pur-paid" type="number" value="0"></div>
        <div id="pur-tot" style="margin-top:12px"></div>
        <div style="display:flex; gap:8px; margin-top:14px">
          <button class="btn btn-ghost btn-sm" data-act="pur-clear">Clear</button>
          <button class="btn btn-gold btn-block" data-act="pur-save">Save purchase</button></div>
      </div>
    </div>`;
  renderPurProducts('');
  const s=$('#pur-search'); if(s) s.oninput=()=>renderPurProducts(s.value);
  const pd=$('#pur-paid'); if(pd) pd.oninput=renderPurLines;
  renderPurLines();
}
function renderPurProducts(q){
  const box=$('#pur-plist'); if(!box) return;
  const list=(state.products||[]).filter(p=>!q||(String(p.Name)+p.Brand+p.SKU).toLowerCase().includes(q.toLowerCase()));
  box.innerHTML=list.map(p=>`<div class="pitem" data-act="pur-add" data-id="${esc(p.ID)}">
      <div><div class="pn">${esc(p.Name)}</div><div class="pd">${esc(p.Brand||'')} · stock ${Number(p.Stock)}</div></div>
      <div class="pr"><div class="tnum" style="font-weight:600">buy ${tk(p.BuyPrice)}</div></div>
      <div class="add">＋</div></div>`).join('')||`<div class="empty">No products. Add in Inventory first.</div>`;
}
function renderPurLines(){
  const box=$('#pur-lines'); if(!box) return;
  if(!state.purCart.length){ box.innerHTML='<div class="empty" style="padding:20px 0">Tap a product to receive stock.</div>'; }
  else box.innerHTML=state.purCart.map(i=>`
    <div class="cl">
      <div class="nm">${esc(i.name)}</div>
      <div class="lt tnum">${tk(i.qty*i.buy)}</div>
      <div class="qty">
        <button data-act="pur-dec" data-id="${esc(i.id)}">−</button><span>${i.qty}</span>
        <button data-act="pur-inc" data-id="${esc(i.id)}">+</button></div>
      <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
        <span style="font-size:11px;color:var(--muted)">buy ৳</span>
        <input type="number" value="${i.buy}" data-buy="${esc(i.id)}" style="width:74px;padding:5px 7px;border:1px solid var(--line-2);border-radius:7px">
        <button class="rm" data-act="pur-del" data-id="${esc(i.id)}">✕</button></div>
    </div>`).join('');
  // bind buy-price inputs
  box.querySelectorAll('[data-buy]').forEach(inp=>{ inp.oninput=()=>{ const it=state.purCart.find(x=>x.id===inp.dataset.buy); if(it){ it.buy=Number(inp.value)||0; updatePurTot(); } }; });
  updatePurTot();
}
function updatePurTot(){
  const box=$('#pur-lines'); if(box) box.querySelectorAll('.cl .lt').forEach((el,idx)=>{ const it=state.purCart[idx]; if(it) el.textContent=tk(it.qty*it.buy); });
  const total=purCartTotal(); const paid=Number($('#pur-paid')?$('#pur-paid').value:0)||0; const due=total-paid;
  const t=$('#pur-tot'); if(t) t.innerHTML=`
    <div class="totline grand"><span>Total</span><span class="v tnum">${tk(total)}</span></div>
    <div class="totline"><span>Due after payment</span><span class="tnum" style="${due>0?'color:var(--neg);font-weight:600':''}">${tk(due)}</span></div>`;
}
function purAdd(id){
  const p=(state.products||[]).find(x=>String(x.ID)===String(id)); if(!p) return;
  const ex=state.purCart.find(i=>i.id===p.ID);
  if(ex) ex.qty++; else state.purCart.push({id:p.ID, name:p.Name, buy:Number(p.BuyPrice)||0, qty:1});
  renderPurLines();
}
function purQty(id,d){ const it=state.purCart.find(i=>i.id===id); if(!it)return; it.qty+=d; if(it.qty<=0) state.purCart=state.purCart.filter(i=>i.id!==id); renderPurLines(); }
async function savePurchase(){
  if(!state.purCart.length){ toast('Add at least one product','err'); return; }
  const sel=$('#pur-sup'); const sid=sel?sel.value:''; const sup=(state.suppliers||[]).find(s=>String(s.ID)===String(sid));
  const purchase={ SupplierID:sid, SupplierName:sup?sup.Name:'', Paid:Number($('#pur-paid').value)||0, Note:'' };
  const items=state.purCart.map(i=>({ProductID:i.id, ProductName:i.name, Qty:i.qty, BuyPrice:i.buy}));
  const btn=document.querySelector('[data-act="pur-save"]'); if(btn){ btn.textContent='Saving…'; btn.disabled=true; }
  try{
    const r=await api('createPurchase',{purchase, items});
    toast('Purchase '+r.purchaseNo+' saved · stock updated','ok');
    state.purCart=[]; state.purTab='list';
    viewPurchases();
  }catch(e){ toast(e.message,'err'); if(btn){ btn.textContent='Save purchase'; btn.disabled=false; } }
}

async function retLoad(){

/* ===================== CSV IMPORT (Products) ===================== */
function parseCSV(text){
  const lines=text.split(/\r?\n/);
  return lines.map(function(line){
    const cells=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
      else if(c===','&&!inQ){ cells.push(cur); cur=''; }
      else cur+=c;
    }
    cells.push(cur); return cells;
  });
}
function skuDupIndexes(items, existing){
  const existingSku={}; (existing||[]).forEach(function(p){ const s=(p.SKU||'').trim().toLowerCase(); if(s) existingSku[s]=true; });
  const seenInFile={}; const dup=[];
  items.forEach(function(it,idx){
    const s=(it.SKU||'').trim().toLowerCase(); if(!s) return;
    if(existingSku[s] || seenInFile[s]) dup.push(idx);
    seenInFile[s]=true;
  });
  return dup;
}
async function importProductsCSV(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(){
    try{
      const rows=parseCSV(String(reader.result)).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
      if(rows.length<2){ toast('CSV ফাঁকা বা শুধু header আছে','err'); input.value=''; return; }
      const hdrs=rows[0].map(function(h){ return h.trim().replace(/\s*\*$/,''); });
      const items=[];
      for(let i=1;i<rows.length;i++){
        const row=rows[i]; const item={};
        hdrs.forEach(function(h,j){ item[h]=(row[j]||'').trim(); });
        if(!item.Name) continue;
        items.push(item);
      }
      if(!items.length){ toast('কোনো valid product row পাওয়া যায়নি','err'); input.value=''; return; }

      let skipSet=null;
      try{
        const existing=await api('listProducts');
        const dupIdx=skuDupIndexes(items, existing);
        if(dupIdx.length){
          const sample=dupIdx.slice(0,8).map(function(i){ return items[i].SKU+(items[i].Name?' — '+items[i].Name:''); }).join('\n');
          const more=dupIdx.length>8?'\n…আরও '+(dupIdx.length-8)+'টা':'';
          const proceed=confirm(
            dupIdx.length+' টা SKU ইতিমধ্যে Inventory-তে আছে (বা এই CSV-তেই দুইবার আছে):\n\n'+sample+more+
            '\n\nOK চাপলে এগুলোও নতুন আলাদা entry হিসেবে import হবে।\nCancel চাপলে শুধু এই SKU-গুলো বাদ দিয়ে বাকি নতুন product-গুলো import হবে।'
          );
          if(!proceed){ skipSet={}; dupIdx.forEach(function(i){ skipSet[i]=true; }); }
        }
      }catch(e){ /* if the check itself fails, continue importing normally */ }

      let count=0, skipped=0;
      for(let i=0;i<items.length;i++){
        if(skipSet && skipSet[i]){ skipped++; continue; }
        await api('saveProduct',{item:items[i]});
        count++;
      }
      input.value='';
      toast(count+' টা product import হয়েছে'+(skipped?' · '+skipped+' টা duplicate SKU বাদ দেওয়া হয়েছে':'')+' ✦','ok');
      viewInventory();
    }catch(e){ toast('Import failed: '+e.message,'err'); input.value=''; }
  };
  reader.readAsText(file,'UTF-8');
}

function saveShopInfo(){
  const cfg=getCfg()||{};
  cfg.shopName=$('#set-name').value.trim(); cfg.shopPhone=$('#set-phone').value.trim();
  cfg.shopAddress=$('#set-addr').value.trim(); cfg.invoiceNote=$('#set-note').value.trim();

}
function doExportBackup(){
  try{
    const data=exportBackup();
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(); const p=n=>('0'+n).slice(-2);
    a.href=url; a.download='ommes-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Backup downloaded ✦','ok');
  }catch(e){ toast('Export failed: '+e.message,'err'); }
}
function doImportBackup(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(){
    try{
      importBackup(String(reader.result));
      await persist();
      toast('Backup restored ✦','ok');
      setNav('dashboard');
    }catch(e){ toast('Import failed: '+e.message,'err'); }
    input.value='';
  };
  reader.readAsText(file);
}

  openModal(`<div class="modal-head"><h3>Please confirm</h3><button class="x" data-act="modal-close">×</button></div>
    <div class="modal-body">${esc(msg)}</div>

}

/* ===================== connect / boot ===================== */
function boot(){
  const su=$('#setup'); if(su) su.style.display='none';
  $('#app').style.display='block';
  setNav('dashboard');
}
/* ===================== PWA: install + offline ===================== */
let deferredPrompt=null;
function showInstall(v){ document.querySelectorAll('.install-btn').forEach(b=>b.style.display=v?'':'none'); }
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt=e; showInstall(true);
});
function doInstall(){
  if(!deferredPrompt){ toast('Use your browser menu ▸ “Install app / Add to Home Screen”'); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; showInstall(false); });
}
window.addEventListener('appinstalled', function(){ showInstall(false); toast('App installed ✦','ok'); });

/* iOS Safari can't auto-prompt — show a manual hint on the setup screen */
(function iosHint(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(isIOS && !standalone){ const h=document.querySelector('.ios-hint'); if(h) h.style.display='block'; }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();  // always check for a newer service worker
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          // a new version has taken over — reload once to show it
          if(nw.state === 'activated' && navigator.serviceWorker.controller){
            if(!window.__reloadedForSW){ window.__reloadedForSW = true; location.reload(); }
          }
        });
      });
    }).catch(function(){ /* offline mode just won't be available */ });
    // if the controlling worker changes (new version), reload once
    var refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshed) return; refreshed = true; location.reload();
    });
  });
}

(async function init(){
  try{ await loadDB(); }catch(e){ ensureDB(); }
  boot();
  if(!PERSIST_OK) toast('Heads up: this browser can\u2019t save data on disk here. Use Export backup often.','err');
})();
</script>
